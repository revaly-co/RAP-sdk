# Stage-2 generation config — PHP core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
# Maintained template surface (re-diff against the embedded originals on any generator
# upgrade — upgrades are ADR-SDK-023 revisions): templates/partial_header.mustache
# (generated-code banner) and templates/php_doc_auth_partial.mustache — forked 2026-07-15
# solely to fix auth guidance (this partial renders the auth block in the README and every
# api doc): the stock example leaves the key prefix-less with a commented-out 'Bearer'
# hint, but the RAP scheme requires `Authorization: ApiKey <key>` — the example now calls
# setApiKeyPrefix('Authorization', 'ApiKey') unconditionally.
# templates/model_generic.mustache — forked 2026-11-05 (SC-886, ADR-SDK-034) from the
# stock v7.23.0 template, with only the two maxLength blocks removed (the setter's
# InvalidArgumentException and the listInvalidProperties() entry), so the SDK never refuses
# a request, or a response it deserializes through the setters, for a string length bound;
# the platform decides. The fork leaves the minLength, pattern, enum and required checks
# as the stock template prints them; in the rtnData models only, the step below then
# removes the minLength, pattern, minimum and value-list checks. The API layer's
# path-parameter bounds (api.mustache) are untouched.
# pipeline/generate.sh rtnData step — added 2026-11-26 (SC-1018, ADR-SDK-034 amendment).
# In lib/Model/RtnData*.php only (RtnData and its ten nested models, the only schemas the
# platform exempts), it deletes, in the setters, the pattern, minimum and minLength throws
# and the sentinel coercions (an unlisted value replaced with unknown_default_open_api),
# and the matching listInvalidProperties() entries, the value-list entries included, so the
# SDK neither refuses an rtnData value for a pattern, minimum or minLength nor replaces an
# unlisted one; the platform decides. The non-null guards stay, and so do the public
# *_UNKNOWN_DEFAULT_OPEN_API constants and get*AllowableValues() methods. It is a step,
# not a template fork, because the stock template has no per-model switch. It runs inside
# the pinned image, deletes whole lines only, and fails generation if the glob matches no
# file, if any removed check survives in the family, if the non-null guard, constant or
# get*AllowableValues() count moves, or if the family's line count is not the old count
# less the lines of the removed checks. Re-check its patterns on any generator upgrade.
# Over-match risk (accepted in SC-1018): the glob selects by file name, so a future schema
# named RtnData* that is not part of the rtnData block would silently lose its checks, and
# no survival check would flag it; at every re-pin, check that each file the glob matches
# is RtnData or one of the models nested in it, and the reverse: that every model nested
# under RtnData is named RtnData*, because a nested model named otherwise would keep its
# checks.
generatorName: php # default guzzle library — the psr-18 library is still beta

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme — [Proposed] until OQ-3 registry
  # provisioning; nothing publishes before then (repo rule 3).
  invokerPackage: 'Revaly\Sdk\Core'
  composerPackageName: revaly/sdk-core
  # composer.json license (SPDX) — ADR-SDK-019: Apache-2.0 decided; Legal ratification
  # gates publish, not build. Never let the generator default this field.
  licenseName: Apache-2.0
  # Open-string safety on closed spec enums (bake-off §A3): setter-level coercion instead
  # of throwing on unknown wire values (the standalone-enum deserialize edge is tracked in
  # §A3; the runtime classifies from the raw response, never from a core enum).
  enumUnknownDefaultCase: true
  hideGenerationTimestamp: true
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-php/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/php/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
