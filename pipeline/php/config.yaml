# Stage-2 generation config — PHP core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
generatorName: php # default guzzle library — the psr-18 library is still beta

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme — [Proposed] until OQ-3 registry
  # provisioning; nothing publishes before then (repo rule 3).
  invokerPackage: 'Revaly\Sdk\Core'
  composerPackageName: revaly/sdk-core
  # composer.json license (SPDX) — ADR-SDK-019: Apache-2.0 decided; Legal ratification
  # gates publish, not build. Never let the generator default this field.
  licenseName: Apache-2.0
  # Open-string safety on closed spec enums (bake-off §A3): setter-level coercion instead
  # of throwing on unknown wire values (the standalone-enum deserialize edge is tracked in
  # §A3; the runtime classifies from the raw response, never from a core enum).
  enumUnknownDefaultCase: true
  hideGenerationTimestamp: true
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-php/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/php/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
