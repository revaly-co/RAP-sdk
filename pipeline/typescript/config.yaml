# Stage-2 generation config — TypeScript core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
#
# typescript-fetch needs no safety flags: zero runtime deps, strict tsc verified in the
# bake-off, and unknown enum wire values pass through verbatim at runtime (§A3).
#
# Deliberately no npmName: without it the generator emits bare TypeScript source only —
# no package.json/tsconfig scaffolding. The core is compiled inside the runtime's package
# (one published package per language, runtime-tdd.md §2); the npm identity is [Proposed]
# until OQ-3 and belongs to the runtime, not the core.
#
# Maintained template surface (re-diff against the embedded originals on any generator
# upgrade — upgrades are ADR-SDK-023 revisions): templates/licenseInfo.mustache (banner)
# and templates/api_example.mustache — forked 2026-07-15 solely to fix auth guidance in
# the generated api docs: typescript-fetch sends the configured apiKey value verbatim as
# the Authorization header, and the RAP scheme requires the `ApiKey` prefix, so the
# example value is now "ApiKey YOUR_API_KEY" instead of the bare key.
#
# templates/modelGeneric.mustache — forked 2026-07-17 (rap-sdk PR pattern of java PR #18 /
# dotnet PR #15) solely to fix instanceOf* for ALL-OPTIONAL models: stock emits a bare
# `return true`, which matches ANY object and breaks oneOf discrimination — the union
# wrappers (GetTransactionByMerchantTransactionId200Response, by-id) tried the all-optional
# TransactionGroupResponse branch before TransactionResponse, so terminal bodies bound to
# the group mapper and lost every field. The fork makes all-optional models match only when
# at least one DECLARED property is present (names inspected, never values; models with
# required properties and zero-property models are unchanged). Pinned by
# languages/typescript/tests/model-serialization.test.ts. Upstream report due at the next
# ADR-SDK-023 revision, alongside the dotnet enum and java oneOf forks.
generatorName: typescript-fetch
