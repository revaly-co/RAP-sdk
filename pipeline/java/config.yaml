# Stage-2 generation config — Java core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
# Maintained template surface (re-diff against the embedded originals on any generator
# upgrade — upgrades are ADR-SDK-023 revisions): templates/licenseInfo.mustache (banner)
# and templates/libraries/native/pom.mustache — forked 2026-07-15 solely to bump the
# hardcoded <jackson-version> 2.21.1 → 2.21.5 (Dependabot: 2 high + 5 medium
# jackson-databind advisories, e.g. GHSA-j3rv-43j4-c7qm/GHSA-rmj7-2vxq-3g9f). Dependency
# floors in generated manifests are fixed HERE, never by editing core/ (rule 1): a
# Dependabot PR against core/ can never pass the stage-2 regen-diff.
# pom.mustache re-forked 2026-08-07: maven-javadoc-plugin gains <doclint>none</doclint> +
# <quiet>true</quiet> so stage 5 can ship the javadoc jar Maven Central requires
# (registry-provisioning.md flip act 6) without doclinting hundreds of undocumented
# generated members into warnings; the attach-javadocs skip came out of package.sh with it.
# pom.mustache re-forked 2026-08-27 (SC-478 Dependabot batch): jackson-version
# 2.21.5 → 2.22.2, jackson-annotations-version 2.21 → 2.22 (jackson2 block only),
# maven-surefire-plugin 3.2.5 → 3.5.6, maven-jar-plugin 3.3.0 → 3.5.1,
# maven-source-plugin 3.2.1 → 3.4.0 (Dependabot #22–#25/#27 core halves; the runtime and
# tests poms carry the same bumps directly).
# pom.mustache re-forked 2026-08-31 (second Dependabot batch): maven-dependency-plugin
# 3.3.0 → 3.11.0, maven-javadoc-plugin 3.4.1 → 3.12.0, spotless.version 2.27.2 →
# 3.10.1 (Dependabot #53/#54/#56 core halves; the runtime, tests and smoke poms carry
# the same bumps directly). Two core floors deliberately did NOT move with that batch:
# jakarta-annotation-version stays 1.3.5 because the generated core imports
# javax.annotation.* in 1806 places and jakarta.annotation-api 2.0+ moved that package
# to the jakarta.* namespace — a generator-level migration (ADR-SDK-023 revision), not a
# manifest bump; junit-version stays 5.10.2 because junit-jupiter 6.x ships Java 17
# bytecode and the enforcer here pins the Java 11 baseline.
# templates/libraries/native/api_doc.mustache + README.mustache — forked 2026-07-15
# solely to fix auth guidance: the stock java api_doc emits okhttp-gson-style
# `ApiKeyAuth`/`setApiKeyPrefix` snippets that DO NOT COMPILE against the `native`
# library (it generates no auth helper classes), and the stock native README shows no
# auth at all. Both now show the native mechanism — a request interceptor sending
# `Authorization: ApiKey <key>` (the RAP scheme's required prefix).
# templates/libraries/native/oneof_model.mustache — forked 2026-07-16 to fix oneOf
# response discrimination (upstream defect): the stock deserializer demands exactly one
# LENIENT match, but all-optional branch models (Jackson ignores unknown properties and
# never enforces setter-level `required`) multi-match every object, so valid 200 bodies
# on the two transaction GETs threw inside the core. Fork (jackson2 legs only): a strict
# fail-on-unknown-properties first pass (spec-aligned bodies bind uniquely), the stock
# lenient pass, then a recognized-top-level-field coverage tiebreak so a server newer
# than the pinned spec (additive fields, e.g. the statementDescriptor precedent) still
# binds instead of throwing. Regression-pinned in the runtime test suite
# (ModelSerializationTests). Raise upstream at the next ADR-SDK-023 revision.
# templates/libraries/native/anyof_model.mustache — forked 2026-08-27 (SC-478 spec
# v2.4.0 re-pin; SC-408 B4 switched the transaction-lookup unions oneOf -> anyOf with
# branches ordered most-specific first): the stock anyOf deserializer binds the FIRST
# branch that LENIENTLY Jackson-decodes — no unknown-property rejection, no required
# enforcement — so every terminal body bound PendingTransactionResponse and every
# single-transaction body bound TransactionGroupResponse. Port of the oneof_model fork
# legs with anyOf resolution (jackson2 legs only): a strict fail-on-unknown-properties
# pass takes the FIRST match in declaration order, then the stock lenient pass, then
# the recognized-top-level-field coverage tiebreak so additive server evolution keeps
# binding. Field names only, never values. Regression-pinned in
# ModelSerializationTests. Raise upstream at the next ADR-SDK-023 revision.
generatorName: java
library: native # JDK 11+ HttpClient + Jackson — leaner than the okhttp-gson default

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme (group id co.revaly) — [Proposed]
  # until OQ-3 registry provisioning; version is a placeholder (stage 5 stamps releases).
  groupId: co.revaly
  artifactId: revaly-sdk-core
  artifactVersion: 0.0.0-SNAPSHOT
  artifactDescription: RAP V2 API generated core (models + endpoint bindings)
  artifactUrl: https://github.com/revaly-co/rap-sdk
  invokerPackage: co.revaly.sdk.core
  apiPackage: co.revaly.sdk.core.api
  modelPackage: co.revaly.sdk.core.model
  # Open-string safety on closed spec enums (bake-off §A3): without this, fromValue()
  # throws IllegalArgumentException on any new wire value — on success paths. The runtime
  # still classifies from the raw response, never from a core enum (ADR-SDK-023).
  enumUnknownDefaultCase: true
  # Java's default is false — timestamps would break the regeneration diff.
  hideGenerationTimestamp: true
  # pom defaults to Unlicense — always set explicitly (ADR-SDK-019: Apache-2.0 decided;
  # Legal ratification gates publish, not build). Maven Central hard-requires license+SCM.
  licenseName: Apache-2.0
  licenseUrl: https://www.apache.org/licenses/LICENSE-2.0.txt
  scmConnection: scm:git:git://github.com/revaly-co/rap-sdk.git
  scmDeveloperConnection: scm:git:ssh://github.com:revaly-co/rap-sdk.git
  scmUrl: https://github.com/revaly-co/rap-sdk
  # [Proposed] contact metadata — replaces the generator's OpenAPITools defaults; finalize
  # at the stage-5 package-metadata freeze (OQ-3 provisioning).
  developerName: Revaly SC Eng
  developerEmail: sdk@revaly.co
  developerOrganization: Revaly
  developerOrganizationUrl: https://revaly.co
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-java/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/java/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
