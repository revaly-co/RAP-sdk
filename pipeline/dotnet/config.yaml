# Stage-2 generation config — .NET core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
# Maintained template surface (re-diff against the embedded originals on any generator
# upgrade — upgrades are ADR-SDK-023 revisions): templates/partial_header.mustache
# (generated-code banner) and templates/libraries/generichost/README.client.mustache —
# forked 2026-07-15 solely to fix the README auth example: the RAP scheme is an API key
# in the Authorization header with the required `ApiKey` prefix (spec securitySchemes
# description), so the example now constructs ApiKeyToken with prefix "ApiKey " instead
# of the stock BearerToken sample, which the API rejects. NOTE: the generated
# ApiKeyToken's prefix parameter still defaults to "Bearer " — left untouched (code
# behavior is upstream's); the stage-3 runtime owns ergonomic auth config.
# templates/libraries/generichost/JsonConverter.mustache — forked 2026-07-16 solely to
# guard OPTIONAL inner-enum serialization with Option.IsSet (stock template dereferences
# the unset Option: constructing e.g. PaymentRequest without paymentMethodType, or
# CreditCard without cardType, threw InvalidOperationException client-side before the
# request reached the wire — found by the stage-3 runtime test suite). Required-property
# output is byte-identical to stock; only the {{^required}} inner-enum legs changed.
# templates/netcore_project.mustache — forked 2026-08-27 (SC-478 Dependabot batch)
# solely to bump the net10.0 Microsoft.Extensions.Http / Hosting / Http.Polly and
# Microsoft.Net.Http.Headers pins 10.0.1 → 10.0.11 (Dependabot #35/#39/#42). Dependency
# floors in generated manifests move HERE, never by editing core/ (rule 1) — the java
# pom.mustache jackson precedent; Dependabot #33/#41 core halves (adding direct
# DependencyInjection / Logging.Abstractions references to the generated csproj) are
# rejected on the same rule, the runtime csproj carries those bumps directly.
generatorName: csharp
library: generichost # csharp default, kept explicit — `httpclient` library is officially Experimental

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme — [Proposed] until OQ-3 registry
  # provisioning; nothing publishes before then (repo rule 3). Version is a placeholder:
  # stage 5 stamps real versions from per-language release tags.
  packageName: Revaly.Sdk.Core
  packageVersion: 0.0.0-dev
  # Fixed GUID: freshly minted GUIDs were the only nondeterminism in the bake-off double
  # run (§A2) — pinning makes regeneration byte-identical.
  packageGuid: "{3A0FA9A2-BE47-4D62-9DDB-C37D0A146A5B}"
  # Open-string safety on closed spec enums (bake-off §A3): unknown wire values map to the
  # UnknownDefaultOpenApi member instead of nulling/throwing. The runtime still classifies
  # from the raw response, never from a core enum (ADR-SDK-023 uniform safety rule).
  enumUnknownDefaultCase: true
  hideGenerationTimestamp: true
  # SPDX id -> <PackageLicenseExpression> (ADR-SDK-019: Apache-2.0 decided; Legal
  # ratification gates publish, not build — never let the generator default this field).
  licenseId: Apache-2.0
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-dotnet/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/dotnet/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
