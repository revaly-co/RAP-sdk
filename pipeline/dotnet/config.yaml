# Stage-2 generation config — .NET core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
generatorName: csharp
library: generichost # csharp default, kept explicit — `httpclient` library is officially Experimental

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme — [Proposed] until OQ-3 registry
  # provisioning; nothing publishes before then (repo rule 3). Version is a placeholder:
  # stage 5 stamps real versions from per-language release tags.
  packageName: Revaly.Sdk.Core
  packageVersion: 0.0.0-dev
  # Fixed GUID: freshly minted GUIDs were the only nondeterminism in the bake-off double
  # run (§A2) — pinning makes regeneration byte-identical.
  packageGuid: "{3A0FA9A2-BE47-4D62-9DDB-C37D0A146A5B}"
  # Open-string safety on closed spec enums (bake-off §A3): unknown wire values map to the
  # UnknownDefaultOpenApi member instead of nulling/throwing. The runtime still classifies
  # from the raw response, never from a core enum (ADR-SDK-023 uniform safety rule).
  enumUnknownDefaultCase: true
  hideGenerationTimestamp: true
  # SPDX id -> <PackageLicenseExpression> (ADR-SDK-019: Apache-2.0 decided; Legal
  # ratification gates publish, not build — never let the generator default this field).
  licenseId: Apache-2.0
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-dotnet/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/dotnet/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
