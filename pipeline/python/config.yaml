# Stage-2 generation config — Python core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
#
# Python has no enumUnknownDefaultCase: open-string safety comes from the forked
# templates/model_generic.mustache, which rewrites the emitted enum @field_validator to
# pass unknown wire values through verbatim (stock validator raises ValueError on
# success-path models — bake-off §A3).
#
# Maintained template surface (re-diff all against the embedded originals on any
# generator upgrade — upgrades are ADR-SDK-023 revisions):
#   templates/partial_header.mustache  — generated-code banner (ADR-SDK-016)
#   templates/model_generic.mustache   — the enum open-vocabulary override above
#   templates/pyproject.mustache, requirements.mustache, setup.mustache — forked
#     2026-07-15 solely to bump dependency floors flagged by Dependabot: urllib3
#     >= 2.7.0 (GHSA-mf9v-mfxr-j63j, GHSA-qccp-gfcp-xxvc — high) in all three, and the
#     dev-group pytest >= 9.0.3 (GHSA-6w46-j5rx-g56g). Dependency floors in generated
#     manifests are fixed HERE, never by editing core/ (rule 1): a Dependabot PR against
#     core/ can never pass the stage-2 regen-diff.
#   templates/python_doc_auth_partial.mustache — forked 2026-07-15 solely to fix auth
#     guidance (this partial renders the auth block in the README and every api doc):
#     the stock example leaves the key prefix-less with a commented-out 'Bearer' hint,
#     but the RAP scheme requires `Authorization: ApiKey <key>` — the example now sets
#     api_key_prefix['ApiKeyAuth'] = 'ApiKey' unconditionally.
#   templates/model_oneof.mustache     — forked 2026-07-17 (java PR #18 / typescript
#     PR #25 pattern): the stock oneOf wrapper demands exactly one lenient match in
#     from_json AND in the actual_instance validator, but the all-optional branch
#     models lenient-match every body, so every valid 200 response raised
#     "Multiple matches found". The fork adds a strict top-level-key pass plus a
#     recognized-field coverage tiebreak (field names only, never values) shared by
#     both sites, and moves the validator to mode='before' so raw dicts are
#     discriminated instead of silently union-coerced into the first all-optional
#     branch; genuinely ambiguous payloads still raise the stock error. Raise
#     upstream at the next generator-pin revision (ADR-SDK-023).
#     2026-08-27 (SC-478 spec v2.4.0 re-pin): SC-408 B4 switched the lookup unions
#     oneOf -> anyOf, so this fork is dormant (the v2.4.0 spec carries no oneOf).
#     anyOf deliberately uses the STOCK template: from_json tries branches in
#     declaration order (most-specific first) and pydantic enforces each branch's
#     required members while ignoring unknown fields, so discrimination is names-only
#     and additive-evolution-safe with no fork. Pinned in
#     languages/python/tests/test_model_serialization.py.
generatorName: python # default urllib3 library

additionalProperties:
  # Identity is the runtime-tdd.md §7 working scheme — [Proposed] until OQ-3 registry
  # provisioning; version is a PEP 440 dev placeholder (stage 5 stamps releases).
  packageName: revaly_sdk_core
  projectName: revaly-sdk-core
  packageVersion: 0.0.0.dev0
  # pyproject license field (SPDX) — ADR-SDK-019: Apache-2.0 decided; Legal ratification
  # gates publish, not build. Never let the generator default this field.
  licenseInfo: Apache-2.0
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-python/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/python/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
