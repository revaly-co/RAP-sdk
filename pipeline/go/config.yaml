# Stage-2 generation config — Go core (normative flag set: ADR-SDK-023 table;
# evidence: docs/generator-bakeoff.md §2/§A). Consumed by pipeline/generate.sh inside the
# digest-pinned generator container; spec/output/template paths are supplied by the script.
# NOTE: the bake-off's "stdlib-only" observation HOLDS again since 2026-08-27 — SC-408
# B4 (spec v2.4.0) switched the lookup unions oneOf -> anyOf, the generator force-imports
# gopkg.in/validator.v2 only into oneOf models, and the v2.4.0 spec carries none, so the
# dependency is dropped from languages/go/go.mod + go.sum. (History: 2026-07-18 through
# v0.5.x the two oneOf wrappers carried the import, never invoked — the model_oneof fork
# below referenced it solely to keep the files compiling.)
# Maintained template surface (re-diff against the embedded originals on any generator
# upgrade — upgrades are ADR-SDK-023 revisions):
#   * templates/partial_header.mustache (generated-code banner);
#   * templates/README.mustache — forked 2026-07-15 solely to fix the README auth
#     example: the stock example sets APIKey{Key: ...} with no Prefix, which sends the
#     bare key; the RAP scheme requires `Authorization: ApiKey <key>`, so the example
#     now sets APIKey{Key: ..., Prefix: "ApiKey"};
#   * templates/model_oneof.mustache — forked 2026-07-18 (sixth materialization of the
#     cross-language oneOf-wrapper defect, docs/README.md § taxonomy): the stock
#     per-branch strict-decode + validator.v2 value-validation eliminated valid branches
#     unconditionally on this spec (regexp validators on Nullable* struct FIELDS are
#     "unsupported type"; {m,n} regexp quantifiers split on validator.v2's tag comma),
#     so BOTH wrappers returned "data failed to match schemas" for every terminal
#     TransactionResponse / TransactionGroupResponse payload — the reconcile lookup and
#     GET /transactions/{id} were unparseable. The fork discriminates by field NAMES
#     only, never values (failover-contract §2): strict unknown-fields pass first
#     (stock semantics minus validator), then — only on zero strict matches — a lenient
#     recognized-field-coverage pass (required keys = json tags without omitempty; the
#     uniquely highest coverage wins; bind from the payload filtered to known keys,
#     lenient so nested additive fields survive). Additive platform fields from minor
#     releases therefore keep binding; ambiguous payloads still return the stock errors
#     verbatim. Dormant since the 2026-08-27 v2.4.0 re-pin (no oneOf left in the spec);
#     retained for any future oneOf. Its regression pin (oneof_discrimination_test.go)
#     is superseded by anyof_discrimination_test.go;
#   * templates/model_anyof.mustache — forked 2026-08-27 (SC-478 spec v2.4.0 re-pin;
#     SC-408 B4 switched the lookup unions oneOf -> anyOf, branches most-specific
#     first): the stock anyOf leg lenient-decodes first-match-wins, but branch models
#     with required members strict-reject unknown fields (DisallowUnknownFields in
#     their generated UnmarshalJSON), so one additive platform field re-bound a pending
#     body as a terminal transaction and hard-failed a group envelope. anyOf variant of
#     the model_oneof fork: the strict pass binds the FIRST match in declaration order;
#     on zero strict matches the lenient coverage pass (required keys present by name,
#     uniquely highest recognized coverage wins) binds through a methodless alias of
#     the branch type, so additive fields survive at every nesting level. Also restores
#     the convenience constructors, GetActualInstance, and fail-loud null handling the
#     stock anyOf leg lacks. Pinned by languages/go/tests/anyof_discrimination_test.go.
generatorName: go

additionalProperties:
  # The core is a package of the single subdir module rooted at languages/go/go.mod
  # (github.com/revaly-co/rap-sdk/languages/go — ADR-SDK-016/022); it must not carry its
  # own module definition.
  packageName: core
  withGoMod: false
  packageVersion: 0.0.0-dev # placeholder; Go release identity comes from tags (stage 5)
  # Open-string safety on closed spec enums (bake-off §A3): named enums gain an unknown
  # default member; inline property enums (incl. ErrorResponse.code) already emit as plain
  # *string and pass unknown wire values through verbatim.
  enumUnknownDefaultCase: true
  # Replaces the generator-fingerprint default UA. The real ADR-SDK-005 grammar is enforced
  # by the runtime at transport level; this placeholder only marks unwrapped-core misuse.
  httpUserAgent: revaly-sdk-go/0.0.0-unwrapped-core

globalProperties:
  # Generated test stubs are not the product — hand-written tests live in
  # languages/go/tests/ (ADR-SDK-016). Remaining test scaffolding is ignore-listed.
  apiTests: "false"
  modelTests: "false"
