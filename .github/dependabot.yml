# Dependabot — SECURITY UPDATES ONLY. Version-update PRs are disabled (2026-09-14).
#
# Why: between 2026-08-27 and 2026-09-07 the weekly schedule opened 52 version-update PRs
# and 0 merged as authored — 51 were closed and redone by hand as batches (#48, #71, #74,
# and #85, the PR that carries this change), and the 52nd (#84, the vitest 5 major) is
# closed with #85 as a standing decline. Dependabot's bumps do not survive this repo's
# constraints: a lock-only bump desyncs the pip `.in` floors from the hash-pinned lock,
# `npm --package-lock-only` drifts transitives, the Maven reactor's 0.0.0-SNAPSHOT siblings
# get "bumped" to the last published jar (a false green — see the one live ignore below),
# and every major needs an individual call. Two config rounds (per-ecosystem grouping,
# per-package ignores) did not change the outcome. Dependency currency is now a hand-run
# monthly sweep — each ecosystem's `outdated` command, shipped as ONE batch PR in the shape
# of #85.
#
# What this file still does:
#   * `open-pull-requests-limit: 0` on every entry is GitHub's documented "security updates
#     only" setting: version updates stop for that ecosystem; security-update PRs are not
#     subject to the limit and keep flowing (repository settings: Dependabot alerts and
#     automated security fixes are both enabled). The `schedule` key is mandatory in the
#     schema and inert at limit 0. The file's presence also keeps the OpenSSF Scorecard
#     Dependency-Update-Tool check satisfied (SC-478) — that check detects the tool by the
#     file, not by its contents.
#   * Per GitHub's options reference, `directories`, `commit-message` AND `ignore` also
#     shape security-update PRs. So the commit prefixes below apply to them — and any
#     `ignore` rule here narrows the security net, which is why the standing declines are
#     recorded as comments (next section), not as live rules. The ONE live ignore
#     (co.revaly:*, maven) is kept on purpose; see its rationale.
#
# Standing declines — the manual sweep's rule book. NOT live rules: a security-update PR
# for any of these still opens (that is the point) and is evaluated individually, with the
# gate failure it causes as the evidence. Each lifts on the condition stated.
#   * typescript >= 7 in languages/typescript/lint: that package pins TS 6.x ON PURPOSE (see
#     its package.json description) as typescript-eslint's type engine — typescript-eslint
#     8.x declares peer `typescript >=4.8.4 <6.1.0`. TS 7 is the native tsc with no JS
#     compiler API and typescript-eslint hard-refuses it ("typescript-eslint does not
#     support TS 7.0", verified 2026-08-31 against PR #73), so the lint gate dies on load.
#     The package ROOT separately pins TS 7.x for `npm run typecheck`; the two cannot share
#     an npm root. Lift when typescript-eslint supports >= 7.1 (typescript-eslint#10940).
#   * vitest / @vitest/coverage-v8 >= 5.0.0: 5.0.0 ships type declarations that fail strict
#     tsc (config.d.ts imports the dropped @vitest/expect; plugin.d.ts references a missing
#     MarkOptions), so the "Typecheck Runtime + Core" gate dies before a test runs, and
#     skipLibCheck would loosen the DX-contract §a typecheck across every declaration to
#     absorb one upstream defect (PR #85). Lift at the first 5.x whose .d.ts set typechecks.
#   * ruff >= 0.16: it rewrote the pyupgrade gate — with `from __future__ import annotations`
#     present (20 of 23 hand-written modules), UP006/UP007/UP035/UP045 fire under
#     target-version = py39, and BLE001 flags the deliberate broad excepts in client.py /
#     reconcile.py / _scrub.py that failover-contract §2 REQUIRES (an unclassifiable failure
#     is OutcomeUnknown — never guess toward "safe"). 158 findings on a tree that is clean
#     under 0.15.22. Moving the lint surface is an ADR-SDK-028 revision, not a dependency
#     bump; lift when that lands.
#   * junit-jupiter 6.x and jakarta.annotation-api 3.x: Java 17 bytecode and the Jakarta
#     EE 11 line respectively; every java module compiles at maven.compiler.release 11
#     (floor set by the generated core's enforcer). Raising the baseline is an ADR decision,
#     not a test-dependency bump.
#
# Scope rule (unchanged, ADR-SDK-001): generated cores (languages/*/core/) change only by
# regeneration, so every entry below points at a hand-written manifest and there is NO
# `/languages/java` entry — languages/java/pom.xml is a reactor aggregator, and Dependabot
# walks its <modules> into core/pom.xml (the 2026-08-31 batch arrived as 20 PRs, 8 of them
# pure duplicates, for exactly that reason). Alerts are driven by the dependency graph, which
# does carry the core-only artifacts (verified 2026-08-31: jsr305, jakarta.annotation-api,
# jackson-datatype-jsr310 all present in the repo SBOM). If Dependabot raises a fix PR
# against a core manifest, it fails the stage-2 regen-diff by design: close it and move the
# floor in the generator template under pipeline/<language>/ instead (ADR-SDK-023;
# pipeline/README.md § Dependency hygiene).
#
# pipeline/requirements/*.txt are pip-compile-style hash-pinned lockfiles (uv-generated,
# paired .in inputs) for the CI pip-install sites — regenerate them from the repo root with
# the command in each lock's own header, never from pipeline/.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directories:
      - /languages/typescript
      - /languages/typescript/lint
      - /pipeline/typescript/compile-check
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: pip
    directories:
      - /languages/python
      - /pipeline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: maven
    directories:
      - /languages/java/runtime
      - /languages/java/tests
      - /languages/java/smoke
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # The reactor's own modules — the one ignore that stays LIVE. It applies to
      # security-update PRs too, and that is correct: a "fix" that bumps our own placeholder
      # is never right (a CVE in our own SDK is fixed by our own release, not by a dependency
      # bump inside its reactor). languages/java/{runtime,tests,smoke} depend on
      # co.revaly:revaly-sdk / revaly-sdk-core at the 0.0.0-SNAPSHOT placeholder that
      # stage 5 stamps at release time; Dependabot resolves that against Maven Central
      # and "bumps" it to the last published release (it proposed 0.5.2 on 2026-08-31,
      # PR #72). That silently breaks reactor substitution: Maven matches siblings on
      # groupId:artifactId:VERSION, so the suite then compiles against the PUBLISHED jar
      # instead of the working tree — a false green, not a build failure. Demonstrated:
      # with 0.5.2 in place, sabotaging RapUserAgent.PRODUCT_NAME still passed 83/83
      # including TransportHeadersTests; at 0.0.0-SNAPSHOT the same edit fails the build.
      # The manual sweep never touches these two coordinates either.
      - dependency-name: co.revaly:*

  - package-ecosystem: nuget
    directories:
      - /languages/dotnet/runtime/Revaly.Sdk
      - /languages/dotnet/tests/Revaly.Sdk.Tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: composer
    directory: /languages/php
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: gomod
    directory: /languages/go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
