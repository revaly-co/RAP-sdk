name: Pipeline

# Stage 1 — validate (docs/pipeline-and-release.md §2, ADR-SDK-006 defense in depth):
# re-verify the pinned gated spec artifact before anything downstream runs. Fail-closed
# (platform ADR 012 lesson): a missing input or tool failure refuses the run — "detector
# fired" and "detector never ran" are never conflated.
#
# Stage 2 — generate (ADR-SDK-023): regenerate all six languages/*/core/ from the pinned
# artifact with the digest-pinned generator (pipeline/generate.sh), then fail unless the
# committed cores are byte-identical — the ADR-SDK-001 "never hand-edit generated code"
# enforcement.
#
# Stage 3 — build + test ×6 (§2 row 3): compile every committed core with a pinned
# toolchain, one job per language — any language red blocks all six. First increment
# is compile-only: the hand-written runtime does not exist yet, so unit tests,
# ecosystem linters (dx-contract.md §a) and the ADR-SDK-020 log-capture scrub tests
# attach to these jobs when languages/*/runtime/ lands (runtime-tdd.md §§1–9).
#
# Stages 4–6 append here as jobs chained with `needs:`. Stages 5–6 (package/publish)
# additionally require a release tag on main and the protected environment — publish is
# embargoed until ADR-SDK-011/013/019/022 gates close (repo rule 3).

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_VERSION: 2.38.0
  # Stage-3 toolchains: minor-pinned, patch-floating. Unlike the spec artifact and the
  # generator image (hard-pinned — they determine committed bytes), stage 3 emits no
  # committed artifacts, so patch drift cannot change repo content, and floating patches
  # keep compiler security fixes flowing. Floors set by the generated manifests: csproj
  # targets net10.0; pom targets source/target 11; composer requires php ^8.1; pyproject
  # requires-python >=3.9; go.mod directive is 1.21.
  DOTNET_SDK_VERSION: 10.0.x
  JDK_VERSION: "21"
  PHP_VERSION: "8.3"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  GO_VERSION: 1.26.x

jobs:
  validate:
    name: Stage 1 - Validate Spec Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Read Pin (spec/pin.yaml)
        id: pin
        run: |
          set -euo pipefail
          for f in spec/pin.yaml spec/openapi.bundled.yaml.sha256 spec/provenance.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — the spec pin is incomplete (ADR-SDK-006)."
              exit 1
            fi
          done
          REPO=$(grep -m1 -E '^repo:' spec/pin.yaml | awk '{print $2}')
          TAG=$(grep -m1 -E '^releaseTag:' spec/pin.yaml | awk '{print $2}')
          SOURCE_COMMIT=$(grep -m1 -E '^sourceCommit:' spec/pin.yaml | awk '{print $2}')
          SPEC_VERSION=$(grep -m1 -E '^specVersion:' spec/pin.yaml | awk '{print $2}')
          PIN_SHA256=$(grep -m1 -E '^  openapi\.bundled\.yaml:' spec/pin.yaml | awk '{print $2}')
          for v in "$REPO" "$TAG" "$SOURCE_COMMIT" "$SPEC_VERSION" "$PIN_SHA256"; do
            if [ -z "$v" ]; then
              echo "::error::spec/pin.yaml is missing a required field (repo/releaseTag/sourceCommit/specVersion/sha256)."
              exit 1
            fi
          done
          {
            echo "repo=$REPO"
            echo "tag=$TAG"
            echo "source_commit=$SOURCE_COMMIT"
            echo "spec_version=$SPEC_VERSION"
            echo "sha256=$PIN_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "Pin: $REPO @ $TAG (spec $SPEC_VERSION, commit ${SOURCE_COMMIT:0:7})"

      # The platform repo is private: the default GITHUB_TOKEN is scoped to THIS repo and
      # cannot read its releases. SPEC_ARTIFACT_READ_TOKEN = fine-grained PAT (platform repo
      # only, Contents: read-only) — see pipeline/README.md. Fail closed if absent.
      - name: Download Pinned Artifact
        env:
          GH_TOKEN: ${{ secrets.SPEC_ARTIFACT_READ_TOKEN }}
          PIN_REPO: ${{ steps.pin.outputs.repo }}
          PIN_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SPEC_ARTIFACT_READ_TOKEN is not set. Stage 1 downloads the pinned artifact from $PIN_REPO (private) — provision a fine-grained PAT (that repo only, Contents: read-only) and add it as a repo secret. See pipeline/README.md."
            exit 1
          fi
          mkdir -p /tmp/artifact
          gh release download "$PIN_TAG" --repo "$PIN_REPO" --dir /tmp/artifact
          ls -la /tmp/artifact

      - name: Verify Checksums and Committed Evidence Copies
        env:
          PIN_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd /tmp/artifact
          # bundle vs the release's own checksum file
          sha256sum -c openapi.bundled.yaml.sha256
          # bundle vs the committed pin
          ACTUAL=$(sha256sum openapi.bundled.yaml | awk '{print $1}')
          if [ "$ACTUAL" != "$PIN_SHA256" ]; then
            echo "::error::openapi.bundled.yaml sha256 ($ACTUAL) does not match spec/pin.yaml ($PIN_SHA256)."
            exit 1
          fi
          # committed evidence copies must be byte-identical to the release assets
          diff "$GITHUB_WORKSPACE/spec/openapi.bundled.yaml.sha256" openapi.bundled.yaml.sha256
          diff "$GITHUB_WORKSPACE/spec/provenance.json" provenance.json
          echo "Checksums verified; committed evidence copies are byte-identical to the release assets."

      - name: Verify Provenance Gates
        env:
          PIN_SHA256: ${{ steps.pin.outputs.sha256 }}
          PIN_SOURCE_COMMIT: ${{ steps.pin.outputs.source_commit }}
          PIN_TAG: ${{ steps.pin.outputs.tag }}
          PIN_SPEC_VERSION: ${{ steps.pin.outputs.spec_version }}
        run: |
          set -euo pipefail
          cd /tmp/artifact
          for gate in lint bundle contractSuite; do
            V=$(jq -r ".gates.${gate}" provenance.json)
            if [ "$V" != "pass" ]; then
              echo "::error::provenance gate '${gate}' is '${V}' (expected 'pass') — artifact refused."
              exit 1
            fi
          done
          B=$(jq -r '.gates.breaking' provenance.json)
          case "$B" in
            pass|allowlisted|first-artifact) ;;
            *) echo "::error::provenance gate 'breaking' is '${B}' — artifact refused."; exit 1 ;;
          esac
          PROV_SHA=$(jq -r '.checksums["openapi.bundled.yaml"]' provenance.json)
          if [ "$PROV_SHA" != "sha256:${PIN_SHA256}" ]; then
            echo "::error::provenance checksum (${PROV_SHA}) does not match the pin (sha256:${PIN_SHA256})."
            exit 1
          fi
          PROV_COMMIT=$(jq -r '.sourceCommit' provenance.json)
          if [ "$PROV_COMMIT" != "$PIN_SOURCE_COMMIT" ]; then
            echo "::error::provenance sourceCommit (${PROV_COMMIT}) does not match the pin (${PIN_SOURCE_COMMIT})."
            exit 1
          fi
          case "$PIN_TAG" in
            *"+${PROV_COMMIT:0:7}") ;;
            *) echo "::error::release tag ${PIN_TAG} suffix does not match sourceCommit ${PROV_COMMIT:0:7}."; exit 1 ;;
          esac
          PROV_VERSION=$(jq -r '.specVersion' provenance.json)
          if [ "$PROV_VERSION" != "$PIN_SPEC_VERSION" ]; then
            echo "::error::provenance specVersion (${PROV_VERSION}) does not match the pin (${PIN_SPEC_VERSION})."
            exit 1
          fi
          echo "Provenance verified: gates green; checksum/commit/version consistent with the pin."

      # Same trust posture as the platform's publish job: npm ci from the committed lockfile
      # verifies the pinned tarball's integrity hash; the version cross-check refuses drift.
      - name: Install Spec Toolchain (lockfile-pinned)
        run: |
          set -euo pipefail
          npm ci --prefix pipeline/spec-tooling --no-audit --no-fund
          INSTALLED=$(pipeline/spec-tooling/node_modules/.bin/redocly --version)
          if [ "$INSTALLED" != "$REDOCLY_VERSION" ]; then
            echo "::error::Installed @redocly/cli ${INSTALLED} does not match pinned ${REDOCLY_VERSION}."
            exit 1
          fi

      - name: Re-Lint and Re-Bundle (defense in depth)
        env:
          PIN_SPEC_VERSION: ${{ steps.pin.outputs.spec_version }}
        run: |
          set -euo pipefail
          pipeline/spec-tooling/node_modules/.bin/redocly lint /tmp/artifact/openapi.bundled.yaml
          pipeline/spec-tooling/node_modules/.bin/redocly bundle /tmp/artifact/openapi.bundled.yaml \
            -o /tmp/artifact/rebundled.yaml
          BUNDLE_VERSION=$(grep -m1 -E '^  version:' /tmp/artifact/openapi.bundled.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          if [ "$BUNDLE_VERSION" != "$PIN_SPEC_VERSION" ]; then
            echo "::error::bundle info.version (${BUNDLE_VERSION}) does not match pin specVersion (${PIN_SPEC_VERSION})."
            exit 1
          fi
          echo "Stage 1 green: artifact authentic, gated, lintable, bundle-stable, version-consistent."

  generate:
    name: Stage 2 - Generate Cores + Regen-Diff
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # One job for all six languages deliberately: a single pull of the digest-pinned
      # generator image (Docker Hub rate limits on shared runners), and "any language red
      # blocks the release for all six" is the pipeline's stance anyway (§2/§3).
      # generate.sh re-downloads the artifact and re-verifies its sha256 against
      # spec/pin.yaml before generating — stage 2 stays fail-closed even standalone.
      - name: Regenerate All Six Cores (pinned artifact, digest-pinned generator)
        env:
          GH_TOKEN: ${{ secrets.SPEC_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SPEC_ARTIFACT_READ_TOKEN is not set. Stage 2 downloads the pinned artifact from the platform repo (private) — see pipeline/README.md."
            exit 1
          fi
          bash pipeline/generate.sh

      # Pathspec note: a plain directory prefix, deliberately. The glob 'languages/*/core'
      # silently matches NOTHING in `git status` (verified 2026-07-15) — a false-green
      # detector. The prefix also catches a generator writing outside core/, which would
      # be a bug worth failing on. Hand-written files (go.mod/go.sum) are untouched by
      # regeneration, so they can never appear in this diff.
      - name: Regeneration Diff (ADR-SDK-001 — generated code is never hand-edited)
        run: |
          set -euo pipefail
          DRIFT=$(git status --porcelain -- languages/)
          if [ -n "$DRIFT" ]; then
            echo "::error::languages/ is not byte-identical to a clean regeneration (pinned spec + pinned generator). Generated code is never hand-edited (ADR-SDK-001) — run pipeline/generate.sh and commit its output. Drift:"
            echo "$DRIFT"
            git --no-pager diff -- languages/ | head -300
            exit 1
          fi
          echo "Stage 2 green: committed cores are byte-identical to regeneration from the pinned artifact with the pinned generator."

  build-dotnet:
    name: Stage 3 - Build + Test (dotnet)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build Solution (core + runtime + tests, Release)
        run: dotnet build languages/dotnet/Revaly.Sdk.slnx -c Release

      # Runs the full runtime suite, including the ADR-SDK-020 log-capture tests
      # (values-free default, scrubbed debug) and the failover-contract §2
      # classification table.
      - name: Test Runtime
        run: dotnet test languages/dotnet/Revaly.Sdk.slnx -c Release --no-build

      # DX contract §a: ecosystem-standard lint, scoped to the hand-written projects —
      # the generated core is never formatted (ADR-SDK-001).
      - name: Format Check (runtime + tests only)
        run: |
          set -euo pipefail
          dotnet format languages/dotnet/runtime/Revaly.Sdk/Revaly.Sdk.csproj --verify-no-changes
          dotnet format languages/dotnet/tests/Revaly.Sdk.Tests/Revaly.Sdk.Tests.csproj --verify-no-changes

  build-java:
    name: Stage 3 - Build + Test (java)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      # Maven itself is the runner-preinstalled 3.9.x — acceptable float for a compile
      # check, same rationale as the patch-floating toolchain pins above.
      - name: Compile Core
        run: mvn -B -ntp -f languages/java/core/pom.xml compile

  build-php:
    name: Stage 3 - Build + Test (php)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, mbstring
          coverage: none

      # PHP has no compile step — the equivalent bar: manifest valid, dependency ranges
      # resolvable, every file parses, and the PSR-4 map is strict-consistent (optimized
      # classmap generation parses every class file a consumer would autoload).
      - name: Validate Composer Manifest
        working-directory: languages/php/core
        run: composer validate --no-check-lock

      - name: Install Dependencies
        working-directory: languages/php/core
        run: composer install --no-interaction --no-progress

      - name: Syntax Lint (php -l over lib/)
        working-directory: languages/php/core
        run: |
          set -euo pipefail
          find lib -name '*.php' -print0 | xargs -0 -n1 -P"$(nproc)" php -l > /dev/null
          echo "php -l clean over lib/"

      - name: PSR-4 Autoload Conformance (strict)
        working-directory: languages/php/core
        run: composer dump-autoload --optimize --strict-psr

  build-typescript:
    name: Stage 3 - Build + Test (typescript)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pipeline/typescript/compile-check/package-lock.json

      # The core is generated without package scaffolding (pipeline/typescript/config.yaml:
      # deliberately no npmName) — it ships inside the runtime's package (runtime-tdd.md §2).
      # Until the runtime lands, pipeline/typescript/compile-check/ is the compile harness:
      # strict tsc, no emit, lockfile-pinned like pipeline/spec-tooling.
      - name: Install Compile-Check Toolchain (lockfile-pinned)
        run: npm ci --prefix pipeline/typescript/compile-check --no-audit --no-fund

      - name: Strict tsc over the Core
        run: pipeline/typescript/compile-check/node_modules/.bin/tsc -p pipeline/typescript/compile-check/tsconfig.json

  build-python:
    name: Stage 3 - Build + Test (python)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Byte-Compile Every Module
        run: python -m compileall -q languages/python/core/revaly_sdk_core

      - name: Install Core Package
        run: python -m pip install --quiet ./languages/python/core

      # Importing the package executes every model module (the package __init__ re-exports
      # all of them), so pydantic class construction is exercised — the closest thing
      # interpreted Python has to a compile gate.
      - name: Import Package
        run: python -c "import revaly_sdk_core; print(revaly_sdk_core.__name__, 'imports clean')"

  build-go:
    name: Stage 3 - Build + Test (go)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: languages/go/go.sum

      - name: Build Module (all packages)
        working-directory: languages/go
        run: go build ./...

      - name: Vet Module (all packages)
        working-directory: languages/go
        run: go vet ./...
