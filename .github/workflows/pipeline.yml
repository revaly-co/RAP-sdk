        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SANDBOX_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SANDBOX_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SANDBOX_GATEWAY_ROUTING_ID }}
          # RAP_SMOKE_FAULT_INJECT deliberately absent: the injector is inert on
          # the production path, so this step SKIPs the 503+not_processed row.
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the prod-sandbox vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
        run: go run ./smoke

      - name: Step 2 - Fault-Injection Smoke (Backbone staging)
        working-directory: languages/go
        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SMOKE_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SMOKE_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SMOKE_GATEWAY_ROUTING_ID }}
          RAP_SMOKE_FAULT_INJECT: ${{ vars.RAP_SMOKE_FAULT_INJECT }}
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the Backbone-staging vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SMOKE_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SMOKE_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SMOKE_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SMOKE_VAULT_TOKEN }}
        run: go run ./smoke

  # ---------------------------------------------------------------------------
  # Stage 5 — package (ADR-SDK-026, docs/pipeline-and-release.md §2 row 5).
  # Runs ONLY on a per-language release tag, and only after all six languages
  # passed build+test AND contract smoke on this very run. The tag names
  # exactly one language (dotnet|java|php|typescript|python|go)/vX.Y.Z; the
  # Go RELEASE tag is go/vX.Y.Z deliberately. languages/go/vX.Y.Z is the Go
  # MODULE tag — since the 2026-08-07 flip it IS the Go registry publish
  # (pkg.go.dev is pull-based; the tag is the release), so stages 5–6 have
  # nothing to do for it: the job-level exclusion below skips them cleanly
  # (a skipped `package` skips both stage-6 jobs via `needs`). Stages 1–4
  # still validate the tagged commit.
  # ---------------------------------------------------------------------------

  package:
    name: Stage 5 - Package (release tag)
    runs-on: ubuntu-latest
    needs:
      - smoke-dotnet
      - smoke-java
      - smoke-php
      - smoke-typescript
      - smoke-python
      - smoke-go
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/languages/go/')

    steps:
      - name: Checkout Repository (full history for the on-main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Parse Release Tag (fail closed)
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/tags/}"
          LANG_ID="${REF%/v*}"
          VERSION="${REF##*/v}"
          case "$LANG_ID" in
            dotnet|java|php|typescript|python|go) ;;
            languages/go)
              # Defense in depth: the job-level if excludes module-form tags, so this
              # branch is unreachable — but if the exclusion ever drifts, fail closed
              # rather than package a module tag (the module tag IS the Go publish;
              # the go GitHub-release channel rides go/vX.Y.Z — ADR-SDK-026).
              echo "::error::Tag ${REF} is the Go MODULE tag form — stages 5-6 have nothing to package for it and the job-level exclusion should have skipped this job (ADR-SDK-026)."
              exit 1 ;;
            *)
              echo "::error::Tag ${REF} does not name a packageable language (expected <dotnet|java|php|typescript|python|go>/vX.Y.Z — ADR-SDK-026)."
              exit 1 ;;
          esac
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${VERSION}' is not plain X.Y.Z — the interim channel ships no pre-release identifiers (ADR-SDK-026)."
            exit 1
          fi
          {
            echo "lang=$LANG_ID"
            echo "version=$VERSION"
            echo "tag=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: $REF → language=$LANG_ID version=$VERSION"

      # ADR-SDK-013: releases come only from tags on main. GitHub cannot enforce
      # "tag points into main" declaratively, so the pipeline proves ancestry
      # itself and refuses tags cut from side branches.
      - name: Verify Tag Commit Is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit $(git rev-parse --short HEAD) is not on main — release tags are cut on main only (ADR-SDK-013)."
            exit 1
          fi
          echo "Tagged commit is reachable from origin/main."

      - name: Setup .NET SDK
        if: steps.tag.outputs.lang == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Setup JDK
        if: steps.tag.outputs.lang == 'java'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Setup PHP
        if: steps.tag.outputs.lang == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, mbstring
          coverage: none

      - name: Setup Node
        if: steps.tag.outputs.lang == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: languages/typescript/package-lock.json

      - name: Setup Python
        if: steps.tag.outputs.lang == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Build Frontend
        if: steps.tag.outputs.lang == 'python'
        run: python3 -m pip install --quiet --require-hashes -r pipeline/requirements/build.txt

      # (go needs no toolchain here: its interim asset is a source-module zip.)

      - name: Package (pipeline/package.sh)
        env:
          LANG_ID: ${{ steps.tag.outputs.lang }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: bash pipeline/package.sh "$LANG_ID" "$VERSION"

      - name: Upload Stage-5 Output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: release-${{ steps.tag.outputs.lang }}
          path: dist/${{ steps.tag.outputs.lang }}/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 6 (interim) — GitHub release (ADR-SDK-026): the sanctioned interim
  # distribution channel while registry publish is embargoed (repo rule 3).
  # gh release create FAILS if the release already exists — deliberate: a
  # failed release never resumes via re-run; fix, then cut a new tag
  # (docs/pipeline-and-release.md §1).
  # ---------------------------------------------------------------------------

  github-release:
    name: Stage 6 (interim) - GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Stage-5 Output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24)
        with:
          # A release run uploads exactly one artifact (release-<lang>). merge-multiple
          # flattens its contents straight into dist/ — deterministic across artifact-action
          # majors (v4 nested under dist/release-<lang>/; v8 already flattens to dist/).
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Re-Verify Checksums After Artifact Transfer
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          echo "Checksums verified post-transfer."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/tags/}"
          LANG_ID="${REF%/v*}"
          VERSION="${REF##*/v}"
          DIR="dist"
          ASSETS=$(find "$DIR" -maxdepth 1 -type f ! -name RELEASE_NOTES.md)
          # --latest=false: per-language releases must not fight over the repo's
          # "latest" pointer; --verify-tag refuses to mint a release for a tag
          # that no longer exists on the remote.
          # shellcheck disable=SC2086
          gh release create "$REF" $ASSETS \
            --repo "$GITHUB_REPOSITORY" \
            --title "revaly-sdk-${LANG_ID} v${VERSION}" \
            --notes-file "$DIR/RELEASE_NOTES.md" \
            --verify-tag \
            --latest=false
          echo "Release $REF published with $(echo "$ASSETS" | wc -l) assets."

  # ---------------------------------------------------------------------------
  # Stage 6 (registries) — DARK until the rule-3 gates close (ADR-SDK-031).
  # Runs on every release tag in the protected `publish` environment so the
  # deployment policies, artifact plumbing, and per-registry flip readiness
  # are proven release by release. Contacts NO registry unless
  # REGISTRY_PUBLISH_MODE (repo variable) is exactly 'live' AND the flip-day
  # guard-removal PR has shipped — pipeline/registry-publish.sh enforces both
  # keys. Ordered after the GitHub release: the interim channel (ADR-SDK-026)
  # is the provenance anchor and is never blocked by registry state; a red
  # registry job never retracts a shipped GitHub release (fix, new tag).
  # ---------------------------------------------------------------------------

  registry-publish:
    name: Stage 6 - Registry Publish (dark until flip)
    runs-on: ubuntu-latest
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: publish
    permissions:
      contents: read
      # OIDC for npm/PyPI/NuGet trusted publishing + the Key Vault login at
      # flip; unused while dark (no step requests a token in dark mode).
      id-token: write
    env:
      REGISTRY_PUBLISH_MODE: ${{ vars.REGISTRY_PUBLISH_MODE || 'dark' }}

    steps:
      # Default-depth checkout: the double-key guard reads the tagged commit
      # (git show HEAD:...) and the php mirror tree is built from the stage-5
      # artifact, not from git history.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse Release Tag + Resolve Mode (fail closed)
        id: tag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF#refs/tags/}"
          LANG_ID="${REF%/v*}"
          VERSION="${REF##*/v}"
          case "$LANG_ID" in
            dotnet|java|php|typescript|python|go) ;;
            *)
              echo "::error::Tag ${REF} does not name a packageable language (stage-5 parse should have refused this run)."
              exit 1 ;;
          esac
          # Fail-closed mode: only the exact string 'live' publishes; unset,
          # empty, or any other value rehearses in dark.
          MODE=dark
          if [ "$REGISTRY_PUBLISH_MODE" = "live" ]; then MODE=live; fi
          {
            echo "lang=$LANG_ID"
            echo "version=$VERSION"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"
          echo "Stage 6 registries: language=$LANG_ID version=$VERSION mode=$MODE"

      - name: Download Stage-5 Output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24)
        with:
          pattern: release-*
          path: dist/${{ steps.tag.outputs.lang }}
          merge-multiple: true

      - name: Setup PHP + Composer (php — mirror-tree validation runs in both modes)
        if: steps.tag.outputs.lang == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer
          coverage: none

      # setup-python first (same as stage 5): the runner's system python is
      # PEP-668 externally-managed and refuses bare pip installs.
      - name: Setup Python (python — metadata check runs in both modes)
        if: steps.tag.outputs.lang == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Twine (python)
        if: steps.tag.outputs.lang == 'python'
        run: python3 -m pip install --quiet --require-hashes -r pipeline/requirements/twine.txt

      - name: Setup Node (typescript live — npm >= 11.5 for OIDC trusted publishing)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup .NET SDK (dotnet live)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # Flip-day binding (OQ-3 publish-day residuals): the trusted-publishing
      # policy on nuget.org and the NUGET_TRUSTED_PUBLISHING_USER variable are
      # created at flip (policies on private repos auto-expire after 7 unused
      # days — docs/registry-provisioning.md).
      - name: NuGet Trusted-Publishing Login (dotnet live)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'dotnet'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

      # Flip-day binding: federated credential for this repo+environment and
      # the PUBLISH_AZURE_*/PUBLISH_KEYVAULT_NAME variables are provisioned at
      # flip (ADR-SDK-013: GPG keys live in Key Vault, fetched in-job).
      - name: Azure Login (java live — Key Vault signing material)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'java'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.PUBLISH_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.PUBLISH_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PUBLISH_AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Maven Signing Material from Key Vault (java live)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'java'
        run: |
          set -euo pipefail
          VAULT="${{ vars.PUBLISH_KEYVAULT_NAME }}"
          [ -n "$VAULT" ] || { echo "::error::PUBLISH_KEYVAULT_NAME variable not set"; exit 1; }
          KEY_FILE="$RUNNER_TEMP/maven-gpg.key"
          az keyvault secret show --vault-name "$VAULT" --name maven-gpg-private-key --query value -o tsv > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          TOKEN="$(az keyvault secret show --vault-name "$VAULT" --name maven-central-token --query value -o tsv)"
          echo "::add-mask::$TOKEN"
          PASS="$(az keyvault secret show --vault-name "$VAULT" --name maven-gpg-passphrase --query value -o tsv 2>/dev/null || true)"
          if [ -n "$PASS" ]; then echo "::add-mask::$PASS"; fi
          {
            echo "MAVEN_GPG_KEY_FILE=$KEY_FILE"
            echo "MAVEN_CENTRAL_TOKEN=$TOKEN"
            echo "MAVEN_GPG_PASSPHRASE=$PASS"
          } >> "$GITHUB_ENV"

      # PACKAGIST_MIRROR_PUSH_TOKEN (environment secret) is provisioned at
      # flip — prefer an org GitHub App scoped to the rap-sdk-php mirror over
      # a long-lived PAT (same family as the OQ-17 cross-repo credential).
      - name: Registry Publish (pipeline/registry-publish.sh)
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGIST_MIRROR_PUSH_TOKEN: ${{ secrets.PACKAGIST_MIRROR_PUSH_TOKEN }}
        run: bash pipeline/registry-publish.sh "${{ steps.tag.outputs.lang }}" "${{ steps.tag.outputs.version }}" "${{ steps.tag.outputs.mode }}"

      - name: PyPI Publish via OIDC (python live)
        if: steps.tag.outputs.mode == 'live' && steps.tag.outputs.lang == 'python'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python/.pypi-upload
