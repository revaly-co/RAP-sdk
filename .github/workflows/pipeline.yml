name: Pipeline

# Stage 1 — validate (docs/pipeline-and-release.md §2, ADR-SDK-006 defense in depth):
# re-verify the pinned gated spec artifact before anything downstream runs. Fail-closed
# (platform ADR 012 lesson): a missing input or tool failure refuses the run — "detector
# fired" and "detector never ran" are never conflated.
#
# Stage 2 — generate (ADR-SDK-023): regenerate all six languages/*/core/ from the pinned
# artifact with the digest-pinned generator (pipeline/generate.sh), then fail unless the
# committed cores are byte-identical — the ADR-SDK-001 "never hand-edit generated code"
# enforcement.
#
# Stage 3 — build + test ×6 (§2 row 3): compile every committed core with a pinned
# toolchain, one job per language — any language red blocks all six. First increment
# is compile-only: the hand-written runtime does not exist yet, so unit tests,
# ecosystem linters (dx-contract.md §a) and the ADR-SDK-020 log-capture scrub tests
# attach to these jobs when languages/*/runtime/ lands (runtime-tdd.md §§1–9).
#
# Stage 4 — contract smoke ×6 (ADR-SDK-024): live runtime-contract suites
# (languages/*/smoke/) against the environment-scoped staging target (interim;
# merchant sandbox key-scope at GA). Gated to release tags + the nightly
# schedule + manual dispatch — NEVER plain PRs (network and secrets stay out of
# the PR path). Blocking on release tags; the nightly run is advisory.
# TWO-TARGET design (ADR-SDK-024 §Decision 4, 2026-07-25). Each language job
# runs its suite twice, because no single target can prove every §2 row:
#   Step 1 — prod sandbox key-scope (RAP_SANDBOX_*), the GA target. The fault
#            injector is inert on the production path
#            (docs/prod-sandbox-validation.md), so the 503+not_processed row
#            SKIPs here — RAP_SMOKE_FAULT_INJECT is deliberately not passed.
#   Step 2 — Backbone staging (RAP_SMOKE_*) with RAP_SMOKE_FAULT_INJECT, the
#            only place the injector exists, proving the one row step 1 cannot.
# Together they cover the full taxonomy, so nothing is demoted to mock-only.
# Both steps run in one job per language, so either failing blocks that
# language — and any language red blocks the release for all six.
# All six secrets plus the injector variable live in the GitHub environment
# `staging` and are fail-closed at job start: an unset injector variable would
# make step 2 silently SKIP the only row licensing immediate failover, so it is
# an error, not a skip. Names in docs/pipeline-and-release.md §6.
#
# Stage 5 — package (ADR-SDK-026): on a per-language release tag only, after
# every language's smoke is green ("any language red blocks the release for
# all six"), pipeline/package.sh stamps the tag version into an ephemeral
# copy of the committed tree and produces the asset + .sha256 +
# provenance.json set (the platform spec/v* release model).
#
# Stage 6 (interim) — GitHub release: uploads the stage-5 output as a GitHub
# release on this repo — the sanctioned interim distribution channel (repo
# rule 3), and the permanent provenance anchor once registries go live
# (ADR-SDK-031: the GitHub release stays after registry GA).
#
# Stage 6 (registries) — registry-publish, DARK until flip (ADR-SDK-031):
# runs on every release tag in the protected `publish` environment, rehearses
# the full publish path (checksums, ADR-SDK-030 names, embargo-guard
# integrity, per-registry flip-readiness lint) and contacts NO registry
# unless the repo variable REGISTRY_PUBLISH_MODE is exactly 'live' AND the
# flip-day guard-removal PR has shipped — the flip is double-keyed
# (pipeline/registry-publish.sh enforces both). Registry publish itself stays
# embargoed until the OQ-3 residuals close (ADR-SDK-019's written ratification
# landed 2026-08-06); flipping is the runbook in docs/registry-provisioning.md.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Per-language release tags (ADR-SDK-016): dotnet/v1.0.0, …; the Go
      # subdir module tags as languages/go/v1.0.0.
      - "**/v*"
  schedule:
    # Nightly advisory smoke (ADR-SDK-024), 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # event_name in the group so the nightly schedule can never cancel (or be
  # cancelled by) a push or dispatch run on the same ref.
  group: pipeline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REDOCLY_VERSION: 2.38.0
  # dx-contract §a linters (ADR-SDK-028): hard-pinned — lint findings are repo-content
  # gates, so versions only move deliberately. Java's Error Prone pin lives in the poms;
  # TypeScript's eslint pins live in languages/typescript/lint/package-lock.json;
  # ruff's pin lives in pipeline/requirements/ruff.in (hash-locked in ruff.txt).
  STATICCHECK_VERSION: v0.7.0
  # Stage-3 toolchains: minor-pinned, patch-floating. Unlike the spec artifact and the
  # generator image (hard-pinned — they determine committed bytes), stage 3 emits no
  # committed artifacts, so patch drift cannot change repo content, and floating patches
  # keep compiler security fixes flowing. Floors set by the generated manifests: csproj
  # targets net10.0; pom targets source/target 11; composer requires php ^8.1; pyproject
  # requires-python >=3.9; go.mod directive is 1.21.
  DOTNET_SDK_VERSION: 10.0.x
  JDK_VERSION: "21"
  PHP_VERSION: "8.3"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  GO_VERSION: 1.26.x

jobs:
  validate:
    name: Stage 1 - Validate Spec Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read Pin (spec/pin.yaml)
        id: pin
        run: |
          set -euo pipefail
          for f in spec/pin.yaml spec/openapi.bundled.yaml.sha256 spec/provenance.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — the spec pin is incomplete (ADR-SDK-006)."
              exit 1
            fi
          done
          REPO=$(grep -m1 -E '^repo:' spec/pin.yaml | awk '{print $2}')
          TAG=$(grep -m1 -E '^releaseTag:' spec/pin.yaml | awk '{print $2}')
          SOURCE_COMMIT=$(grep -m1 -E '^sourceCommit:' spec/pin.yaml | awk '{print $2}')
          SPEC_VERSION=$(grep -m1 -E '^specVersion:' spec/pin.yaml | awk '{print $2}')
          PIN_SHA256=$(grep -m1 -E '^  openapi\.bundled\.yaml:' spec/pin.yaml | awk '{print $2}')
          for v in "$REPO" "$TAG" "$SOURCE_COMMIT" "$SPEC_VERSION" "$PIN_SHA256"; do
            if [ -z "$v" ]; then
              echo "::error::spec/pin.yaml is missing a required field (repo/releaseTag/sourceCommit/specVersion/sha256)."
              exit 1
            fi
          done
          {
            echo "repo=$REPO"
            echo "tag=$TAG"
            echo "source_commit=$SOURCE_COMMIT"
            echo "spec_version=$SPEC_VERSION"
            echo "sha256=$PIN_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "Pin: $REPO @ $TAG (spec $SPEC_VERSION, commit ${SOURCE_COMMIT:0:7})"

      # The platform repo is private: the default GITHUB_TOKEN is scoped to THIS repo and
      # cannot read its releases. SPEC_ARTIFACT_READ_TOKEN = fine-grained PAT (platform repo
      # only, Contents: read-only) — see pipeline/README.md. Fail closed if absent.
      - name: Download Pinned Artifact
        env:
          GH_TOKEN: ${{ secrets.SPEC_ARTIFACT_READ_TOKEN }}
          PIN_REPO: ${{ steps.pin.outputs.repo }}
          PIN_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SPEC_ARTIFACT_READ_TOKEN is not set. Stage 1 downloads the pinned artifact from $PIN_REPO (private) — provision a fine-grained PAT (that repo only, Contents: read-only) and add it as a repo secret. See pipeline/README.md."
            exit 1
          fi
          mkdir -p /tmp/artifact
          gh release download "$PIN_TAG" --repo "$PIN_REPO" --dir /tmp/artifact
          ls -la /tmp/artifact

      - name: Verify Checksums and Committed Evidence Copies
        env:
          PIN_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd /tmp/artifact
          # bundle vs the release's own checksum file
          sha256sum -c openapi.bundled.yaml.sha256
          # bundle vs the committed pin
          ACTUAL=$(sha256sum openapi.bundled.yaml | awk '{print $1}')
          if [ "$ACTUAL" != "$PIN_SHA256" ]; then
            echo "::error::openapi.bundled.yaml sha256 ($ACTUAL) does not match spec/pin.yaml ($PIN_SHA256)."
            exit 1
          fi
          # committed evidence copies must be byte-identical to the release assets
          diff "$GITHUB_WORKSPACE/spec/openapi.bundled.yaml.sha256" openapi.bundled.yaml.sha256
          diff "$GITHUB_WORKSPACE/spec/provenance.json" provenance.json
          echo "Checksums verified; committed evidence copies are byte-identical to the release assets."

      - name: Verify Provenance Gates
        env:
          PIN_SHA256: ${{ steps.pin.outputs.sha256 }}
          PIN_SOURCE_COMMIT: ${{ steps.pin.outputs.source_commit }}
          PIN_TAG: ${{ steps.pin.outputs.tag }}
          PIN_SPEC_VERSION: ${{ steps.pin.outputs.spec_version }}
        run: |
          set -euo pipefail
          cd /tmp/artifact
          for gate in lint bundle contractSuite; do
            V=$(jq -r ".gates.${gate}" provenance.json)
            if [ "$V" != "pass" ]; then
              echo "::error::provenance gate '${gate}' is '${V}' (expected 'pass') — artifact refused."
              exit 1
            fi
          done
          B=$(jq -r '.gates.breaking' provenance.json)
          case "$B" in
            pass|allowlisted|first-artifact) ;;
            *) echo "::error::provenance gate 'breaking' is '${B}' — artifact refused."; exit 1 ;;
          esac
          PROV_SHA=$(jq -r '.checksums["openapi.bundled.yaml"]' provenance.json)
          if [ "$PROV_SHA" != "sha256:${PIN_SHA256}" ]; then
            echo "::error::provenance checksum (${PROV_SHA}) does not match the pin (sha256:${PIN_SHA256})."
            exit 1
          fi
          PROV_COMMIT=$(jq -r '.sourceCommit' provenance.json)
          if [ "$PROV_COMMIT" != "$PIN_SOURCE_COMMIT" ]; then
            echo "::error::provenance sourceCommit (${PROV_COMMIT}) does not match the pin (${PIN_SOURCE_COMMIT})."
            exit 1
          fi
          case "$PIN_TAG" in
            *"+${PROV_COMMIT:0:7}") ;;
            *) echo "::error::release tag ${PIN_TAG} suffix does not match sourceCommit ${PROV_COMMIT:0:7}."; exit 1 ;;
          esac
          PROV_VERSION=$(jq -r '.specVersion' provenance.json)
          if [ "$PROV_VERSION" != "$PIN_SPEC_VERSION" ]; then
            echo "::error::provenance specVersion (${PROV_VERSION}) does not match the pin (${PIN_SPEC_VERSION})."
            exit 1
          fi
          echo "Provenance verified: gates green; checksum/commit/version consistent with the pin."

      # Same trust posture as the platform's publish job: npm ci from the committed lockfile
      # verifies the pinned tarball's integrity hash; the version cross-check refuses drift.
      - name: Install Spec Toolchain (lockfile-pinned)
        run: |
          set -euo pipefail
          npm ci --prefix pipeline/spec-tooling --no-audit --no-fund
          INSTALLED=$(pipeline/spec-tooling/node_modules/.bin/redocly --version)
          if [ "$INSTALLED" != "$REDOCLY_VERSION" ]; then
            echo "::error::Installed @redocly/cli ${INSTALLED} does not match pinned ${REDOCLY_VERSION}."
            exit 1
          fi

      - name: Re-Lint and Re-Bundle (defense in depth)
        env:
          PIN_SPEC_VERSION: ${{ steps.pin.outputs.spec_version }}
        run: |
          set -euo pipefail
          pipeline/spec-tooling/node_modules/.bin/redocly lint /tmp/artifact/openapi.bundled.yaml
          pipeline/spec-tooling/node_modules/.bin/redocly bundle /tmp/artifact/openapi.bundled.yaml \
            -o /tmp/artifact/rebundled.yaml
          BUNDLE_VERSION=$(grep -m1 -E '^  version:' /tmp/artifact/openapi.bundled.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          if [ "$BUNDLE_VERSION" != "$PIN_SPEC_VERSION" ]; then
            echo "::error::bundle info.version (${BUNDLE_VERSION}) does not match pin specVersion (${PIN_SPEC_VERSION})."
            exit 1
          fi
          echo "Stage 1 green: artifact authentic, gated, lintable, bundle-stable, version-consistent."

  generate:
    name: Stage 2 - Generate Cores + Regen-Diff
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # One job for all six languages deliberately: a single pull of the digest-pinned
      # generator image (Docker Hub rate limits on shared runners), and "any language red
      # blocks the release for all six" is the pipeline's stance anyway (§2/§3).
      # generate.sh re-downloads the artifact and re-verifies its sha256 against
      # spec/pin.yaml before generating — stage 2 stays fail-closed even standalone.
      - name: Regenerate All Six Cores (pinned artifact, digest-pinned generator)
        env:
          GH_TOKEN: ${{ secrets.SPEC_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret SPEC_ARTIFACT_READ_TOKEN is not set. Stage 2 downloads the pinned artifact from the platform repo (private) — see pipeline/README.md."
            exit 1
          fi
          bash pipeline/generate.sh

      # Pathspec note: a plain directory prefix, deliberately. The glob 'languages/*/core'
      # silently matches NOTHING in `git status` (verified 2026-07-15) — a false-green
      # detector. The prefix also catches a generator writing outside core/, which would
      # be a bug worth failing on. Hand-written files (go.mod/go.sum) are untouched by
      # regeneration, so they can never appear in this diff.
      - name: Regeneration Diff (ADR-SDK-001 — generated code is never hand-edited)
        run: |
          set -euo pipefail
          DRIFT=$(git status --porcelain -- languages/)
          if [ -n "$DRIFT" ]; then
            echo "::error::languages/ is not byte-identical to a clean regeneration (pinned spec + pinned generator). Generated code is never hand-edited (ADR-SDK-001) — run pipeline/generate.sh and commit its output. Drift:"
            echo "$DRIFT"
            git --no-pager diff -- languages/ | head -300
            exit 1
          fi
          echo "Stage 2 green: committed cores are byte-identical to regeneration from the pinned artifact with the pinned generator."

  build-dotnet:
    name: Stage 3 - Build + Test (dotnet)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build Solution (core + runtime + tests, Release)
        run: dotnet build languages/dotnet/Revaly.Sdk.slnx -c Release

      # Runs the full runtime suite, including the ADR-SDK-020 log-capture tests
      # (values-free default, scrubbed debug) and the failover-contract §2
      # classification table.
      - name: Test Runtime
        run: |
          set -euo pipefail
          dotnet test languages/dotnet/Revaly.Sdk.slnx -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings languages/dotnet/coverlet.runsettings \
            --results-directory "${RUNNER_TEMP}/coverage-dotnet"

      # Report-only: no threshold gates the build (see docs/pipeline-and-release.md
      # §2.1). Scope is the hand-written runtime — coverlet.runsettings excludes the
      # generated core, which unit coverage is the wrong instrument for.
      - name: Coverage Summary (runtime)
        run: |
          set -euo pipefail
          report=$(find "${RUNNER_TEMP}/coverage-dotnet" -name 'coverage.cobertura.xml' | head -1)
          [[ -n "$report" ]] || { echo "::error::No cobertura report produced."; exit 1; }
          pct=$(python3 -c "import sys,xml.etree.ElementTree as ET; print(f\"{float(ET.parse(sys.argv[1]).getroot().get('line-rate'))*100:.1f}\")" "$report")
          echo "dotnet runtime line coverage: ${pct}%"
          echo "| dotnet | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

      # DX contract §a: ecosystem-standard lint, scoped to the hand-written projects —
      # the generated core is never formatted (ADR-SDK-001).
      - name: Format Check (runtime + tests only)
        run: |
          set -euo pipefail
          dotnet format languages/dotnet/runtime/Revaly.Sdk/Revaly.Sdk.csproj --verify-no-changes
          dotnet format languages/dotnet/tests/Revaly.Sdk.Tests/Revaly.Sdk.Tests.csproj --verify-no-changes
          dotnet format languages/dotnet/smoke/Revaly.Sdk.Smoke/Revaly.Sdk.Smoke.csproj --verify-no-changes

  build-java:
    name: Stage 3 - Build + Test (java)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      # Maven itself is the runner-preinstalled 3.9.x — acceptable float for a compile
      # check, same rationale as the patch-floating toolchain pins above.
      - name: Compile Core
        run: mvn -B -ntp -f languages/java/core/pom.xml compile

      # Full reactor (core + runtime + tests) via the hand-written aggregator pom. Runs
      # the runtime suite, including the ADR-SDK-020 log-capture tests (values-free
      # default, scrubbed debug), the failover-contract §2 classification table, and the
      # core oneOf/optional-enum regression probes.
      - name: Build + Test Runtime
        run: mvn -B -ntp -f languages/java/pom.xml test

      # jacoco's report-aggregate is phase-bound to `test` in tests/pom.xml, so the
      # command above already produced this. Report-only; scope excludes the generated
      # core (docs/pipeline-and-release.md §2.1).
      - name: Coverage Summary (runtime)
        run: |
          set -euo pipefail
          csv=languages/java/tests/target/site/jacoco-aggregate/jacoco.csv
          [[ -f "$csv" ]] || { echo "::error::No jacoco aggregate report at $csv."; exit 1; }
          pct=$(awk -F, 'NR>1 {miss+=$4; cov+=$5} END {if (miss+cov==0) exit 1; printf "%.1f", cov*100/(miss+cov)}' "$csv")
          echo "java runtime instruction coverage: ${pct}%"
          echo "| java | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

      # DX contract §a: ecosystem-standard lint, scoped to the hand-written modules via
      # -pl (NEVER the generated core — ADR-SDK-001; formatting core would trip the
      # stage-2 regen diff). Decided per ADR-SDK-028: spotless/google-java-format is the
      # formatter; Error Prone (default ERROR checks, pinned in the module poms) is the
      # static analyzer and rides every compile in the Build + Test step above.
      - name: Format Check (runtime + tests only)
        run: mvn -B -ntp -f languages/java/pom.xml -pl runtime,tests,smoke spotless:check

  build-php:
    name: Stage 3 - Build + Test (php)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, mbstring
          # pcov, not xdebug: coverage-only driver, an order of magnitude cheaper. Stage 3
          # is the one job that measures coverage — the smoke and package jobs keep
          # `coverage: none`, since a coverage driver there would only cost time.
          coverage: pcov

      # PHP has no compile step — the equivalent bar: manifest valid, dependency ranges
      # resolvable, every file parses, and the PSR-4 map is strict-consistent (optimized
      # classmap generation parses every class file a consumer would autoload).
      - name: Validate Composer Manifest
        working-directory: languages/php/core
        run: composer validate --no-check-lock

      - name: Install Dependencies
        working-directory: languages/php/core
        run: composer install --no-interaction --no-progress

      - name: Syntax Lint (php -l over lib/)
        working-directory: languages/php/core
        run: |
          set -euo pipefail
          find lib -name '*.php' -print0 | xargs -0 -n1 -P"$(nproc)" php -l > /dev/null
          echo "php -l clean over lib/"

      - name: PSR-4 Autoload Conformance (strict)
        working-directory: languages/php/core
        run: composer dump-autoload --optimize --strict-psr

      # Runtime package (languages/php — runtime-tdd §§1-9): same bar as the core
      # (manifest, resolvable ranges, parse-clean, strict PSR-4 across runtime AND the
      # re-exported core), then the hand-written suite: classification (§2 rows),
      # transport headers, reconcile, no-retry, scrubber + log-capture (ADR-SDK-020),
      # core-behaviour pins, quickstart.
      - name: Validate Runtime Composer Manifest
        working-directory: languages/php
        run: composer validate --no-check-lock

      - name: Install Runtime Dependencies
        working-directory: languages/php
        run: composer install --no-interaction --no-progress

      - name: Syntax Lint (php -l over runtime/ + smoke/ + tests/)
        working-directory: languages/php
        run: |
          set -euo pipefail
          find runtime smoke tests -name '*.php' -print0 | xargs -0 -n1 -P"$(nproc)" php -l > /dev/null
          echo "php -l clean over runtime/ + smoke/ + tests/"

      - name: PSR-4 Autoload Conformance (runtime, strict)
        working-directory: languages/php
        run: composer dump-autoload --optimize --strict-psr

      - name: Runtime Tests (PHPUnit)
        working-directory: languages/php
        run: vendor/bin/phpunit --no-progress

      # phpunit.xml's <source><include> already scopes coverage to runtime/src, so the
      # generated core is out of frame. Report-only.
      - name: Coverage Summary (runtime)
        working-directory: languages/php
        run: |
          set -euo pipefail
          vendor/bin/phpunit --no-progress --coverage-clover "${RUNNER_TEMP}/clover.xml" > /dev/null
          pct=$(python3 -c "import sys,xml.etree.ElementTree as ET; m=ET.parse(sys.argv[1]).getroot().find('project/metrics'); s=int(m.get('statements')); print(f\"{int(m.get('coveredstatements'))*100/s:.1f}\" if s else 'n/a')" "${RUNNER_TEMP}/clover.xml")
          echo "php runtime statement coverage: ${pct}%"
          echo "| php | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

  build-typescript:
    name: Stage 3 - Build + Test (typescript)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            pipeline/typescript/compile-check/package-lock.json
            languages/typescript/package-lock.json
            languages/typescript/lint/package-lock.json

      # The core is generated without package scaffolding (pipeline/typescript/config.yaml:
      # deliberately no npmName) — it ships inside the runtime's package (runtime-tdd.md §2).
      # pipeline/typescript/compile-check/ additionally proves the core compiles STANDALONE
      # (no node globals, no runtime imports): strict tsc, no emit, lockfile-pinned.
      - name: Install Compile-Check Toolchain (lockfile-pinned)
        run: npm ci --prefix pipeline/typescript/compile-check --no-audit --no-fund

      - name: Strict tsc over the Core
        run: pipeline/typescript/compile-check/node_modules/.bin/tsc -p pipeline/typescript/compile-check/tsconfig.json

      # The runtime package (languages/typescript): strict typecheck over core + runtime +
      # tests, then the contract test suite — classification matrix (failover-contract §2),
      # reconcile verdicts (§3), transport headers (ADR-SDK-005), ADR-SDK-020 log-capture
      # scrub assertions, and the pinned core-serialization probes.
      - name: Install Runtime Toolchain (lockfile-pinned)
        run: npm ci --prefix languages/typescript --no-audit --no-fund

      - name: Typecheck Runtime + Core (strict tsc)
        run: npm run typecheck --prefix languages/typescript

      - name: Runtime Tests (vitest)
        run: npm test --prefix languages/typescript

      # vitest.config.ts scopes coverage to runtime/src. Report-only.
      - name: Coverage Summary (runtime)
        run: |
          set -euo pipefail
          npm run test:coverage --prefix languages/typescript
          pct=$(python3 -c "import json; d=json.load(open('languages/typescript/coverage/coverage-summary.json'))['total']; print(f\"{d['statements']['pct']:.1f}\")")
          echo "typescript runtime statement coverage: ${pct}%"
          echo "| typescript | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

      # DX contract §a linter (ADR-SDK-028): eslint + typescript-eslint (typed rules incl.
      # no-floating-promises), hand-written surfaces only — core/ is globally ignored in
      # eslint.config.mjs. The lint toolchain is lockfile-isolated in languages/typescript/
      # lint/ (native tsc 7.x has no JS compiler API for the linter; same isolated-toolchain
      # pattern as pipeline/typescript/compile-check). prelint bootstraps it via npm ci.
      - name: Lint Runtime (eslint, hand-written surfaces only)
        run: npm run lint --prefix languages/typescript

  build-python:
    name: Stage 3 - Build + Test (python)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Byte-Compile Every Module
        run: python -m compileall -q languages/python/core/revaly_sdk_core

      # PyPI dependencies come from the hash-pinned lockfile (Scorecard Pinned-Dependencies;
      # SC-478); the local package then installs with --no-deps so nothing unpinned is fetched.
      - name: Install Core Package
        run: |
          python -m pip install --quiet --require-hashes -r pipeline/requirements/python-runtime.txt
          python -m pip install --quiet --no-deps ./languages/python/core

      # Importing the package executes every model module (the package __init__ re-exports
      # all of them), so pydantic class construction is exercised — the closest thing
      # interpreted Python has to a compile gate.
      - name: Import Package
        run: python -c "import revaly_sdk_core; print(revaly_sdk_core.__name__, 'imports clean')"

      - name: Byte-Compile Runtime + Smoke + Tests
        run: python -m compileall -q languages/python/runtime/revaly_sdk languages/python/smoke languages/python/tests

      # The SDK ships as ONE distribution with the generated core riding inside
      # (runtime-tdd §2, php/ts precedent). Uninstalling the standalone core install
      # first proves the combined package is self-contained.
      - name: Install SDK Package
        run: |
          python -m pip uninstall --quiet -y revaly_sdk_core
          python -m pip install --quiet --require-hashes -r pipeline/requirements/python-dev.txt
          python -m pip install --quiet --no-deps ./languages/python

      - name: Import SDK Package
        run: python -c "import revaly_sdk; print(revaly_sdk.__name__, revaly_sdk.SDK_VERSION, 'imports clean')"

      - name: Runtime Tests (pytest)
        run: python -m pytest languages/python/tests -q

      # --source scopes to the runtime package; the generated core (revaly_sdk_core) is
      # deliberately out of frame. Report-only.
      - name: Coverage Summary (runtime)
        working-directory: languages/python
        run: |
          set -euo pipefail
          python -m coverage run --source=revaly_sdk -m pytest tests -q > /dev/null
          python -m coverage report
          pct=$(python -m coverage report --format=total)
          echo "python runtime statement coverage: ${pct}%"
          echo "| python | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

      # DX contract §a linter (ADR-SDK-028): ruff check + format gate, pinned, over the
      # hand-written trees only — NEVER languages/python/core/ (ADR-SDK-001; reformatting
      # the core would trip the stage-2 regen diff). [tool.ruff] config lives in
      # languages/python/pyproject.toml.
      - name: Lint Runtime (ruff, hand-written surfaces only)
        run: |
          python -m pip install --quiet --require-hashes -r pipeline/requirements/ruff.txt
          ruff check languages/python/runtime languages/python/tests languages/python/smoke
          ruff format --check languages/python/runtime languages/python/tests languages/python/smoke

  build-go:
    name: Stage 3 - Build + Test (go)
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: languages/go/go.sum

      - name: Build Module (all packages)
        working-directory: languages/go
        run: go build ./...

      - name: Vet Module (all packages)
        working-directory: languages/go
        run: go vet ./...

      - name: Module Tests (go test)
        working-directory: languages/go
        run: go test ./...

      # -coverpkg names the hand-written surface explicitly (ADR-SDK-028 layout): the
      # root package, internal/runtime, and raptest. The generated core is out of frame.
      # Report-only.
      - name: Coverage Summary (runtime)
        working-directory: languages/go
        run: |
          set -euo pipefail
          go test ./tests/... -coverpkg=./,./internal/runtime,./raptest \
            -coverprofile="${RUNNER_TEMP}/go-cover.out" > /dev/null
          pct=$(go tool cover -func="${RUNNER_TEMP}/go-cover.out" | awk '/^total:/ {gsub("%","",$3); printf "%.1f", $3}')
          echo "go runtime statement coverage: ${pct}%"
          echo "| go | ${pct}% |" >> "$GITHUB_STEP_SUMMARY"

      # dx-contract §a for Go (ADR-SDK-028): gofmt + go vet + pinned staticcheck.
      # Hand-written surfaces only — the generated core ships as the generator emits it
      # (ADR-SDK-001; vet still covers it above, where a finding would be a generator bug).
      - name: Format Check (gofmt, hand-written packages)
        working-directory: languages/go
        run: |
          UNFORMATTED=$(gofmt -l revaly.go internal raptest smoke tests)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt needed on: $UNFORMATTED"
            exit 1
          fi

      - name: Lint (staticcheck, hand-written packages)
        working-directory: languages/go
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}"
          "$(go env GOPATH)/bin/staticcheck" . ./internal/... ./raptest/... ./smoke/... ./tests/...

  # ---------------------------------------------------------------------------
  # Stage 4 — contract smoke ×6 (ADR-SDK-024, docs/pipeline-and-release.md §2
  # row 4): each language's languages/<lang>/smoke/ suite runs live against the
  # environment-scoped staging target and proves the SDK's classification
  # against reality (charge approved/declined, validation + auth rejections,
  # the injected 503+not_processed fast-failover row, reconcile Found both
  # ways, NotFoundYet). Never on plain PRs; blocking on release tags; nightly
  # is advisory. Fail-closed when secrets are unprovisioned — a silent skip
  # would read as coverage that never ran (ADR-SDK-006 posture).
  # ---------------------------------------------------------------------------

  smoke-dotnet:
    name: Stage 4 - Contract Smoke (dotnet)
    runs-on: ubuntu-latest
    needs: build-dotnet
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require Smoke Secrets (fail closed)
        env:
          RAP_SANDBOX_BASE_URL: ${{ secrets.RAP_SANDBOX_BASE_URL }}
          RAP_SANDBOX_API_KEY: ${{ secrets.RAP_SANDBOX_API_KEY }}
          RAP_SANDBOX_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SANDBOX_GATEWAY_ROUTING_ID }}
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SMOKE_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SMOKE_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SMOKE_GATEWAY_ROUTING_ID }}
          FAULT_INJECT: ${{ vars.RAP_SMOKE_FAULT_INJECT }}
          SANDBOX_VAULT: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
          SANDBOX_VAULT_KEY: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}
          SANDBOX_VAULT_CUSTOMER: ${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}
          SANDBOX_VAULT_ROUTING: ${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}
          SANDBOX_VAULT_TOKEN: ${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
          SMOKE_VAULT_KEY: ${{ secrets.RAP_SMOKE_VAULT_API_KEY }}
          SMOKE_VAULT_CUSTOMER: ${{ secrets.RAP_SMOKE_VAULT_CUSTOMER_ID }}
          SMOKE_VAULT_ROUTING: ${{ secrets.RAP_SMOKE_VAULT_ROUTING_ID }}
          SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SMOKE_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          for v in RAP_SANDBOX_BASE_URL RAP_SANDBOX_API_KEY RAP_SANDBOX_GATEWAY_ROUTING_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not provisioned in the 'staging' environment (ADR-SDK-024 step 1 — prod sandbox key-scope). The routing id is required, not optional: without it charges route to the declining sink (responseCode 50130) and no approval row can pass (docs/prod-sandbox-validation.md)."
              exit 1
            fi
          done
          for v in RAP_SMOKE_BASE_URL RAP_SMOKE_API_KEY RAP_SMOKE_GATEWAY_ROUTING_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not provisioned in the 'staging' environment (ADR-SDK-024 step 2 — Backbone staging fault seam)."
              exit 1
            fi
          done
          # Fail closed on the injector too. An unset variable would make step 2
          # SKIP the 503+not_processed row silently, and that row is the only one
          # licensing immediate failover — silent loss is the failure mode this
          # two-step design exists to prevent.
          if [ -z "$FAULT_INJECT" ]; then
            echo "::error::the 'staging' environment variable RAP_SMOKE_FAULT_INJECT is unset (expected: pre-dispatch). Step 2 proves the 503+not_processed row; unset would silently SKIP it (ADR-SDK-024)."
            exit 1
          fi
          # The vault-token set (spec 2.6.0 / SC-477), per target. A PARTIAL set
          # is a hard error — a half-configured credential degrades the row into
          # a decline that reads like a product defect. A wholly ABSENT set is a
          # warning: the rows SKIP visibly and the run stays green, which is the
          # state until the secrets are provisioned in the 'staging' environment.
          for target in SANDBOX SMOKE; do
            key="${target}_VAULT_KEY"; cust="${target}_VAULT_CUSTOMER"
            route="${target}_VAULT_ROUTING"; tok="${target}_VAULT_TOKEN"
            set_count=0
            for v in "$key" "$cust" "$route" "$tok"; do
              [ -n "${!v}" ] && set_count=$((set_count + 1))
            done
            if [ "$set_count" -eq 0 ]; then
              echo "::warning::RAP_${target}_VAULT_* is not provisioned in the 'staging' environment — the vault-token rows will SKIP on this target. The spec-2.6.0 vaultToken surfaces are then unproven here (docs/pipeline-and-release.md §2)."
            elif [ "$set_count" -ne 4 ]; then
              echo "::error::RAP_${target}_VAULT_* is only partially provisioned ($set_count/4). All four of API_KEY, CUSTOMER_ID, ROUTING_ID and TOKEN are required together: a vault token is stored against a (token, customer) PAIR and a mismatched set declines 50168, which reads like a broken token and is not."
              exit 1
            fi
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Step 1 - Contract Smoke (prod sandbox key-scope)
        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SANDBOX_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SANDBOX_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SANDBOX_GATEWAY_ROUTING_ID }}
          # RAP_SMOKE_FAULT_INJECT deliberately absent: the injector is inert on
          # the production path, so this step SKIPs the 503+not_processed row.
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the prod-sandbox vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
        run: dotnet run --project languages/dotnet/smoke/Revaly.Sdk.Smoke -c Release

      - name: Step 2 - Fault-Injection Smoke (Backbone staging)
        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SMOKE_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SMOKE_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SMOKE_GATEWAY_ROUTING_ID }}
          RAP_SMOKE_FAULT_INJECT: ${{ vars.RAP_SMOKE_FAULT_INJECT }}
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the Backbone-staging vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SMOKE_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SMOKE_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SMOKE_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SMOKE_VAULT_TOKEN }}
        run: dotnet run --project languages/dotnet/smoke/Revaly.Sdk.Smoke -c Release

  smoke-java:
    name: Stage 4 - Contract Smoke (java)
    runs-on: ubuntu-latest
    needs: build-java
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require Smoke Secrets (fail closed)
        env:
          RAP_SANDBOX_BASE_URL: ${{ secrets.RAP_SANDBOX_BASE_URL }}
          RAP_SANDBOX_API_KEY: ${{ secrets.RAP_SANDBOX_API_KEY }}
          RAP_SANDBOX_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SANDBOX_GATEWAY_ROUTING_ID }}
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SMOKE_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SMOKE_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SMOKE_GATEWAY_ROUTING_ID }}
          FAULT_INJECT: ${{ vars.RAP_SMOKE_FAULT_INJECT }}
          SANDBOX_VAULT: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
          SANDBOX_VAULT_KEY: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}
          SANDBOX_VAULT_CUSTOMER: ${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}
          SANDBOX_VAULT_ROUTING: ${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}
          SANDBOX_VAULT_TOKEN: ${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
          SMOKE_VAULT_KEY: ${{ secrets.RAP_SMOKE_VAULT_API_KEY }}
          SMOKE_VAULT_CUSTOMER: ${{ secrets.RAP_SMOKE_VAULT_CUSTOMER_ID }}
          SMOKE_VAULT_ROUTING: ${{ secrets.RAP_SMOKE_VAULT_ROUTING_ID }}
          SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SMOKE_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          for v in RAP_SANDBOX_BASE_URL RAP_SANDBOX_API_KEY RAP_SANDBOX_GATEWAY_ROUTING_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not provisioned in the 'staging' environment (ADR-SDK-024 step 1 — prod sandbox key-scope). The routing id is required, not optional: without it charges route to the declining sink (responseCode 50130) and no approval row can pass (docs/prod-sandbox-validation.md)."
              exit 1
            fi
          done
          for v in RAP_SMOKE_BASE_URL RAP_SMOKE_API_KEY RAP_SMOKE_GATEWAY_ROUTING_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not provisioned in the 'staging' environment (ADR-SDK-024 step 2 — Backbone staging fault seam)."
              exit 1
            fi
          done
          # Fail closed on the injector too. An unset variable would make step 2
          # SKIP the 503+not_processed row silently, and that row is the only one
          # licensing immediate failover — silent loss is the failure mode this
          # two-step design exists to prevent.
          if [ -z "$FAULT_INJECT" ]; then
            echo "::error::the 'staging' environment variable RAP_SMOKE_FAULT_INJECT is unset (expected: pre-dispatch). Step 2 proves the 503+not_processed row; unset would silently SKIP it (ADR-SDK-024)."
            exit 1
          fi
          # The vault-token set (spec 2.6.0 / SC-477), per target. A PARTIAL set
          # is a hard error — a half-configured credential degrades the row into
          # a decline that reads like a product defect. A wholly ABSENT set is a
          # warning: the rows SKIP visibly and the run stays green, which is the
          # state until the secrets are provisioned in the 'staging' environment.
          for target in SANDBOX SMOKE; do
            key="${target}_VAULT_KEY"; cust="${target}_VAULT_CUSTOMER"
            route="${target}_VAULT_ROUTING"; tok="${target}_VAULT_TOKEN"
            set_count=0
            for v in "$key" "$cust" "$route" "$tok"; do
              [ -n "${!v}" ] && set_count=$((set_count + 1))
            done
            if [ "$set_count" -eq 0 ]; then
              echo "::warning::RAP_${target}_VAULT_* is not provisioned in the 'staging' environment — the vault-token rows will SKIP on this target. The spec-2.6.0 vaultToken surfaces are then unproven here (docs/pipeline-and-release.md §2)."
            elif [ "$set_count" -ne 4 ]; then
              echo "::error::RAP_${target}_VAULT_* is only partially provisioned ($set_count/4). All four of API_KEY, CUSTOMER_ID, ROUTING_ID and TOKEN are required together: a vault token is stored against a (token, customer) PAIR and a mismatched set declines 50168, which reads like a broken token and is not."
              exit 1
            fi
          done

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      # Two invocations deliberately: a direct exec:java with -am would run on
      # every reactor module (core has no mainClass), and -pl smoke alone
      # cannot resolve the SNAPSHOT dependency — so install the reactor first
      # (tests already ran in build-java), then exec only the smoke module.
      - name: Step 1 - Contract Smoke (prod sandbox key-scope)
        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SANDBOX_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SANDBOX_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SANDBOX_GATEWAY_ROUTING_ID }}
          # RAP_SMOKE_FAULT_INJECT deliberately absent: the injector is inert on
          # the production path, so this step SKIPs the 503+not_processed row.
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the prod-sandbox vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SANDBOX_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SANDBOX_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SANDBOX_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SANDBOX_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          # -Dmaven.javadoc.skip=true: the generated core's maven-javadoc-plugin
          # (core/pom.xml attach-javadocs) doclints undocumented generated members and
          # emits hundreds of "warning: no comment" annotations; the smoke build needs
          # no javadoc jar. (GA/Maven-Central javadoc is a generator-template concern.)
          mvn -B -ntp -f languages/java/pom.xml -pl smoke -am -DskipTests -Dmaven.javadoc.skip=true install
          mvn -B -ntp -f languages/java/pom.xml -pl smoke exec:java

      - name: Step 2 - Fault-Injection Smoke (Backbone staging)
        env:
          RAP_SMOKE_BASE_URL: ${{ secrets.RAP_SMOKE_BASE_URL }}
          RAP_SMOKE_API_KEY: ${{ secrets.RAP_SMOKE_API_KEY }}
          RAP_SMOKE_GATEWAY_ROUTING_ID: ${{ secrets.RAP_SMOKE_GATEWAY_ROUTING_ID }}
          RAP_SMOKE_FAULT_INJECT: ${{ vars.RAP_SMOKE_FAULT_INJECT }}
          # The vault-token rows run on BOTH targets (spec 2.6.0 / SC-477); this
          # step carries the Backbone-staging vault credential.
          RAP_SMOKE_VAULT_API_KEY: ${{ secrets.RAP_SMOKE_VAULT_API_KEY }}
          RAP_SMOKE_VAULT_CUSTOMER_ID: ${{ secrets.RAP_SMOKE_VAULT_CUSTOMER_ID }}
          RAP_SMOKE_VAULT_ROUTING_ID: ${{ secrets.RAP_SMOKE_VAULT_ROUTING_ID }}
          RAP_SMOKE_VAULT_TOKEN: ${{ secrets.RAP_SMOKE_VAULT_TOKEN }}
        run: |
          set -euo pipefail
          # Step 1 already installed the reactor into this workspace, so this
          # step only needs the exec.
          mvn -B -ntp -f languages/java/pom.xml -pl smoke exec:java

  smoke-php:
    name: Stage 4 - Contract Smoke (php)
    runs-on: ubuntu-latest
    needs: build-php
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
