# Announce a per-language release to the engineering notices channel.
#
# Strategy mirrors revaly-co/RTN-horizon-relay's notify-teams-on-release: notification follows
# the SAME trigger as the thing it announces, so it cannot be skipped by choosing
# `git push --tags` over `gh release create`. There, a tag pushed without a GitHub Release
# deployed to prod and announced nothing for ~20 hours (v1.2.0, 2026-08-06). Here the exposure
# is the same shape: stages 5-6 fire on `push: tags`, so a tag alone publishes to a public
# registry — an irreversible act — with no notice.
#
# Deliberately a separate workflow, not a step in pipeline.yml: stage 6 publishes from the
# protected `publish` environment under a single human gate (ADR-SDK-013), and a chat webhook
# has no business inside that gate. A failed notification must never mark a good release red,
# nor a failed release green.
#
# TAG SHAPES HERE (ADR-SDK-016/026) — this is where the RTN template needed real adaptation.
# Release tags are per-language, `<lang>/vX.Y.Z`, and each one publishes an independent package
# to its own registry. So a six-language release posts six cards, one per package — matching
# what actually shipped, since any language can be released alone. The Go module-form tag
# `languages/go/vX.Y.Z` is a distribution mechanic rather than a second release, and is
# excluded exactly as stages 5-6 exclude it.
#
# SETUP: needs a repository secret TEAMS_WEBHOOK_URL pointing at the engineering notices
# channel. Until it exists, every run fails loudly at the final step — chosen over skipping,
# because a silent notifier is the failure mode this workflow exists to prevent.

name: Notify Teams on Release

on:
  release:
    types: [published]

  push:
    tags:
      # Same filter as pipeline.yml's release trigger. The module-form Go tag matches too and
      # is filtered out in the job below, where the reason can be stated.
      - "**/v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to backfill a notification for (e.g. python/v0.5.1)"
        required: true
        type: string

permissions:
  contents: read

# Pushing a tag and publishing its release in quick succession fires both triggers. The
# release-event run carries the human-written notes, so a later run cancels an in-flight
# earlier one. A release published long after its tag notifies again — correct, that is a
# distinct human-meaningful event. Keyed per tag so six per-language releases never cancel
# each other.
concurrency:
  group: notify-teams-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  notify_teams:
    runs-on: ubuntu-latest
    steps:
      # Full history: the annotated tag message stands in for release notes when a tag was
      # pushed without a GitHub Release.
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse Release Tag
        id: tag
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            release) tag="${{ github.event.release.tag_name }}" ;;
            push)    tag="${GITHUB_REF#refs/tags/}" ;;
            *)       tag="${{ inputs.tag }}" ;;
          esac

          lang="${tag%/v*}"
          version="${tag##*/v}"

          # Mirrors pipeline.yml's Parse Release Tag, including the module-tag carve-out.
          case "$lang" in
            dotnet)     package="Revaly.Sdk";              registry="NuGet";         url="https://www.nuget.org/packages/Revaly.Sdk/${version}" ;;
            java)       package="co.revaly:revaly-sdk";    registry="Maven Central"; url="https://central.sonatype.com/artifact/co.revaly/revaly-sdk/${version}" ;;
            php)        package="revaly/sdk";              registry="Packagist";     url="https://packagist.org/packages/revaly/sdk" ;;
            typescript) package="@revaly/sdk";             registry="npm";           url="https://www.npmjs.com/package/@revaly/sdk/v/${version}" ;;
            python)     package="revaly-sdk";              registry="PyPI";          url="https://pypi.org/project/revaly-sdk/${version}/" ;;
            go)         package="github.com/revaly-co/rap-sdk/languages/go"; registry="Go module proxy"; url="https://pkg.go.dev/github.com/revaly-co/rap-sdk/languages/go@v${version}" ;;
            languages/go)
              # The Go MODULE tag. Its sibling `go/vX.Y.Z` is the release that stages 5-6 act
              # on and that this workflow announces; announcing both would double-post one
              # release (ADR-SDK-026).
              echo "::notice::${tag} is the Go module-form tag — the go/v${version} release tag carries the announcement. Nothing to post."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *)
              # Fail closed, as the pipeline does: an unannounceable tag under `**/v*` means
              # either a typo or a new tag convention, and both deserve a red run.
              echo "::error::Tag ${tag} does not name a releasable language (expected <dotnet|java|php|typescript|python|go>/vX.Y.Z — ADR-SDK-026)."
              exit 1 ;;
          esac

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${version}' is not plain X.Y.Z (ADR-SDK-026)."
            exit 1
          fi

          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "lang=${lang}"
            echo "version=${version}"
            echo "package=${package}"
            echo "registry=${registry}"
            echo "registry_url=${url}"
          } >> "$GITHUB_OUTPUT"

          echo "Announcing ${tag} → ${lang} ${version} on ${registry}"

      - name: Resolve Release Metadata
        id: meta
        if: steps.tag.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # A tag push can arrive before — or entirely without — a GitHub Release, which is the
          # whole reason the push trigger exists. This lookup is allowed to fail.
          if release_json=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" 2>/dev/null); then
            title=$(jq -r '.name // .tag_name'  <<<"$release_json")
            body=$(jq  -r '.body // ""'         <<<"$release_json")
            commit=$(jq -r '.target_commitish'  <<<"$release_json")
            author=$(jq -r '.author.login'      <<<"$release_json")
          else
            title="${TAG}"
            body=$(git tag -l --format='%(contents)' "${TAG}")
            [[ -n "${body}" ]] || body="_No GitHub Release for this tag, and the annotated tag carried no message._"
            body="${body}"$'\n\n'"_⚠️ Announced from the pushed tag: no GitHub Release exists for \`${TAG}\`. Stages 5-6 publish on tag push, so this shipped regardless — publish a Release to add proper notes and the spec commit._"
            commit=$(git rev-list -n 1 "${TAG}")
            author="${{ github.actor }}"
          fi

          {
            echo "title=${title}"
            echo "commit=${commit}"
            echo "author=${author}"
          } >> "$GITHUB_OUTPUT"

          printf '%s' "$body" > release_body.md

      - name: Build Teams Adaptive Card Payload
        if: steps.tag.outputs.skip == 'false'
        env:
          LANG_ID: ${{ steps.tag.outputs.lang }}
          VERSION: ${{ steps.tag.outputs.version }}
          PACKAGE: ${{ steps.tag.outputs.package }}
          REGISTRY: ${{ steps.tag.outputs.registry }}
          REGISTRY_URL: ${{ steps.tag.outputs.registry_url }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          AUTHOR: ${{ steps.meta.outputs.author }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          repo_url="https://github.com/${repo}"
          release_url="${repo_url}/releases/tag/${TAG}"
          commit_url="${repo_url}/commit/${COMMIT}"
          author_url="https://github.com/${AUTHOR}"

          # Flatten markdown headings to bold; linkify PR references. Adaptive Cards render a
          # restricted markdown subset, so headings would otherwise arrive as literal '##'.
          body=$(sed -E 's|^#{1,6}[[:space:]]+(.+)$|**\1**|' release_body.md \
                 | sed -E 's|(https://github\.com/[^/]+/[^/]+/pull/([0-9]+))|[#\2](\1)|g')

          jq -n \
            --arg lang "$LANG_ID" --arg version "$VERSION" \
            --arg title "$TITLE" --arg release_url "$release_url" \
            --arg repo "$repo" --arg repo_url "$repo_url" \
            --arg tag "$TAG" \
            --arg package "$PACKAGE" --arg registry "$REGISTRY" --arg registry_url "$REGISTRY_URL" \
            --arg commit "$COMMIT" --arg commit_url "$commit_url" \
            --arg author "$AUTHOR" --arg author_url "$author_url" \
            --arg body "$body" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  msteams: { width: "Full" },
                  body: [
                    {
                      type: "TextBlock",
                      text: ("RAP-sdk " + $lang + " [" + $title + "](" + $release_url + ") 🚀"),
                      weight: "Bolder",
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: ("**Published:** [" + $package + "](" + $registry_url + ") "
                             + $version + " on " + $registry),
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: ("**Repository:** [" + $repo + "](" + $repo_url + ")"
                             + " · **Tag:** [" + $tag + "](" + $release_url + ")"
                             + " · **Commit:** [" + $commit + "](" + $commit_url + ")"
                             + " · **Released By:** [" + $author + "](" + $author_url + ")"),
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: $body,
                      wrap: true
                    }
                  ]
                }
              }]
            }' > payload.json

      - name: Post to Teams
        if: steps.tag.outputs.skip == 'false'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${TEAMS_WEBHOOK_URL:-}" ]]; then
            echo "::error::TEAMS_WEBHOOK_URL secret is not set or empty — the release shipped but nothing was announced."
            exit 1
          fi

          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            -o "$RESP_FILE" -w '%{http_code}' \
            -X POST "${TEAMS_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "Teams responded HTTP ${HTTP_CODE}"
          cat "$RESP_FILE"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Teams notification failed (HTTP ${HTTP_CODE})."
            exit 1
          fi
