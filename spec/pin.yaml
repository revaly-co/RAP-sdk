notes: >-
  Fifteenth pin (was spec/v2.19.0+ec71a82; EI-117). Two platform artifacts in one bump; the bundle
  differs from v2.19.0 in four changed and seven added lines, and no schema shape changes. (1)
  v2.20.0+92f2191 (Backbone PR #516): the RtnData description states that every field is an
  optional signal, that no rtnData value ever refuses the payment that carries it, and that the
  lengths, formats and value lists describe what the card issuers can use; a value outside them,
  or of the wrong JSON type, is accepted and RTN trims, converts, shortens or leaves out that one
  value. `rtnData.customerData.email` maxLength rises from 30 to 256. No SDK refuses a longer
  string before sending (ADR-SDK-034), so the raised bound changes no SDK behaviour. At
  this pin, the patterns, value lists and minimums that the spec keeps on rtnData were
  checked by the cores that generate those checks (ADR-SDK-034 §2); since SC-1018 (the
  ADR-SDK-034 amendment of 2026-11-26), the Python and PHP cores no longer check them on
  rtnData and send a value of the right type as given, and the other four cores are
  unchanged (the amendment's decisions 4 and 6). (2) v2.21.0+66e302b (EI-117, Backbone PRs
  #509, #515 and #520): prose only. The lookup by merchant transaction ID
  (`GET /transactions/merchant/{merchantTransactionId}`) returns `gatewayResponsePayload` on its
  single TransactionResponse when the payload is switched on for the calling API key, for the
  attempt it returns; the field's description names the lookup. The field already exists on
  TransactionResponse since v2.18.0, so the generated types are unchanged. The breaking-change
  gate reports `pass` on both artifacts. No error code, transactionType value set, reconcile
  verdict or status change, so the failover classification surface is untouched
  (failover-contract §2). Lint, bundle and contract suite pass on v2.21.0; provenance ciRunId
  45862195011. v2.20.0+92f2191 is superseded by this pin, not skipped. Prior pin history:
  v2.1.2+9af661b (first pin, int64 maximum fix) -> v2.1.3+e75c71a (orphan PaymentMethodRequest dropped) ->
