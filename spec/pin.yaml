notes: >-
  Fourteenth pin (was spec/v2.18.0+834f684; SC-409). One platform artifact, v2.19.0+ec71a82
  (SC-409, Backbone PR #512, the remainder of the SC-408 spec-drift audit); the bundle loses 25
  lines and gains 261 against v2.18.0. (1) listTransactions: each 200 item is now a `oneOf` of
  the flat TransactionListItem, which gains `required: [transactionId]`, and the new
  TransactionListPaymentMethodItem, the shape of a payment-method operation (create, update,
  redact or recache) in detailed mode, whose fields are wrapped in `transaction` (required
  transactionId, transactionDate, transactionStatus) and whose payment method is the new flat
  TransactionListPaymentMethod (BIN under `issuerIdentificationNumber`). The generator emits the
  item union as ListTransactions200ResponseInner in all six cores, so the listTransactions
  return type changes in every SDK. The top-level `paymentMethod` on TransactionListItem, which
  the platform never sends, is deprecated; the `storageState` / `paymentMethodStorageState`
  split, the 90-day default window, the midnight-UTC `endDate` rule and the transactionType names
  (PreAuth, SuccessfulPayment, Verify, the payment-method operation names) are documented. (2)
  CreatePaymentMethodRequest gains `required: [paymentMethod]` (M7; the platform already answered
  400 without it). Generated required-field checks stay as generated (ADR-SDK-034 §2 limits that
  ADR to `maxLength`), and the .NET and Go constructors take `paymentMethod` as a required
  argument. (3) NotifyResponse gains `required: [success]` and NotifyData documents which events
  need `transactionId` or `customerId` (M8, M13). The platform's breaking-change gate reports
  `allowlisted` for the two spec-accuracy entries (the required `paymentMethod` and the list item
  `oneOf`); stage 1 accepts `allowlisted`. No error code, transactionType value set, reconcile
  verdict or status change, and listTransactions is not on the reconcile path, so the failover
  classification surface is untouched (failover-contract §2). Lint, bundle and contract suite pass
