notes: >-
  Twelfth pin (was spec/v2.15.0+693a36b; SC-661). One platform artifact, v2.16.0+99cb098
  (SC-661, Backbone PR #439); the bundle differs from v2.15.0 in five lines on three request
  schemas. `customerIp` on PaymentRequest and AuthorizeRequest gains `maxLength: 45` and a
  description naming IPv4 or IPv6 text; `merchantTransactionId` on RefundCancelRequest rises
  from `maxLength: 50` to 100. Backbone's contract check records the new customerIp bound
  without refusing while its 30-day census runs (to 2026-12-04, SC-661); Olympus already
  declines a value over 45 characters (50037), and the direct path accepts up to 50. No response shape, error
  code, transactionType, reconcile verdict or status change, so the failover classification
  surface is untouched (failover-contract §2). All four platform gates pass on v2.16.0;
  provenance ciRunId 41859970321. OQ-18 is decided by ADR-SDK-034: an SDK does not refuse a
  request for a body field's length bound before sending, and the platform decides. The generated
  Python and PHP cores still check `maxLength` (Python when a model is built or assigned, PHP in
  its setters), so this pin releases .NET, Java, TypeScript and Go only; Python and PHP release
  after their template revision. Prior pin history: v2.1.2+9af661b (first
  pin, int64 maximum fix) -> v2.1.3+e75c71a (orphan PaymentMethodRequest dropped) ->
  v2.2.0+1e59620 (additive statementDescriptor, STR-108) -> v2.2.1+c4000e9 (X-Correlation-ID
  response header documented) -> v2.3.0+80cc897 (validation reality matches the published
  contract) -> v2.4.0+4ce73e2 (nested vaultToken on charge/authorize, lookup unions oneOf ->
  anyOf, 404 on charge/authorize) -> v2.6.0+abf71b6 (flat vaultToken on TransactionListItem,
  nested vaultToken on the transaction reads, recordRefund documented for gateway-routed
  transactions) -> v2.7.0+7a05e7b (bypassPlatform deprecated, true refused with 404) ->
  v2.12.2+cec0b33 (seven artifacts absorbed, v2.8.0 to v2.12.2: recordRefund 422 prose,
  returned-expiry prose, expiryUpdated / cardReplaced, echo bounds to 1024 with base64 reference
  examples, the optional 3DS context block, the acceptHeader example without a comment
  terminator, the channel recording prose) -> v2.13.0+98915d8 (SC-660 AC1, the edge firewall's
  403 marker prose in ErrorResponse `details`, the per-operation instruction, and the 403 and
  409 descriptions; prose only) -> v2.15.0+693a36b (SC-869, four artifacts v2.13.1 to v2.15.0:
  `description` on charge and authorize bounded at 256 characters with platform truncation
  (SC-785); `merchantTrustLevel` gains MODERATELY_TRUSTED and NOT_TRUSTED moves to the end,
  which renumbers the implicit .NET enum values (NOTTRUSTED 2 -> 4; the wire value is the name);
