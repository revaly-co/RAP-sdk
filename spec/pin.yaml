notes: >-
  Tenth pin (was spec/v2.12.2+cec0b33). One platform artifact, v2.13.0 (SC-660 AC1, RFC-071
  D8, Backbone PR #392), prose only; the bundle differs from v2.12.2 in exactly five lines: the
  version and four descriptions. (1) The ErrorResponse `details` description documents the edge
  firewall's 403 block body: `details.edgeRejection` equal to the JSON boolean `true` means the
  request never reached the payment platform and its merchantTransactionId was not consumed;
  `details.reference` is the edge tracking reference (equal to the `x-azure-ref` header); the
  body is served as text/html, so every 403 body is parsed as JSON regardless of content type;
  the match is on the marker and never on the `error` sentence; a 403 without the marker is
  final; and the per-operation instruction (charge and authorize resubmit with corrected content
  or fail over, never both for one id, and fail over only when no earlier submission may have
  reached the platform; capture, void, refund, refund-cancel, payment-method and notify calls
  never fail over, confirm state with a lookup, then resubmit once). (2) The `code` description
  states it stays absent on every 4xx, the edge 403 included. (3) The 403 (Forbidden)
  description tells the edge block apart from the platform's own rejection. (4) The 409
  (Conflict) description adds the rule for a resubmission after an edge block. `details` stays
  typeless; no response object is added; no shape, bound, enum, status or error-code change, so
  the failover classification surface is untouched (failover-contract §2) and the
  marker-reading classification already on main (ADR-SDK-033, PR #103) is unchanged by this
  pin. This is the pin that ADR-SDK-033 Decision 9 requires before the minor release of all six
  packages: the generated reference now carries the marker's meaning. All four platform gates
