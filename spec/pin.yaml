  `cardReplaced` descriptions name Worldpay Litle V11 and Adyen beside Chase Orbital and Worldpay
  Litle as real-time account updaters. (2) v2.17.0+19b899b (EI-113, Backbone PR #477): the
  optional response field `gatewayResponsePayload` on TransactionResponse, a string holding the
  processing gateway's own answer as one JSON document, reduced to the keys the platform lists
  for that gateway, with a card-number-shaped value masked; present only on a payment, capture,
  void or refund sent directly to the gateway when the API key has the payload switched on, and
  otherwise absent, never null or empty. (3) v2.18.0+834f684 (SC-934, Backbone PR #495): the
  optional, nullable `transactionLinkId` (Mastercard Transaction Link ID) on StoredCredential,
  the stored-credential block of PaymentRequest and AuthorizeRequest, with `maxLength: 22`, and
  on StoredCredentialResponse, the block returned in TransactionResponse, without a bound. No SDK
  refuses a longer value before sending (ADR-SDK-034; SC-886 removed the Python and PHP checks),
  so the ADR-SDK-034 release gate holds no language back from this pin. Both new response fields
  are additive; no error code, transactionType, reconcile verdict or status change, so the
