notes: >-
  Second pin (was spec/v2.1.2+9af661b). Backbone PR #242 drops the orphan
  `components/schemas/PaymentMethodRequest` — a superseded ancestor of CreatePaymentMethodRequest
  that no operation referenced. openapi-generator emits a model for every components/schemas
  entry regardless of reachability, and core/ is never hand-edited (repo rule 1), so the orphan
  would have shipped as an unusable public type in all six SDKs whose name shadows the correct
  one. Removing a public type post-1.0 is a semver-major break, so it had to land pre-GA.
  Bundle diff v2.1.2 -> v2.1.3 is exactly info.version + the 41-line schema removal.
  Prior pin history: v2.1.1+f5f9576 was never pinned (five amount-field `maximum` values exceed
  int64 max — the redocly bundler double-rounds integers past 2^53 — blocking the .NET core
  compile); fixed by Backbone PR #241 -> v2.1.2. Evidence: docs/generator-bakeoff.md §3.1.
