notes: >-
  Eleventh pin (was spec/v2.13.0+98915d8, SC-869). Four platform artifacts absorbed, v2.13.1 to
  v2.15.0; the bundle differs from v2.13.0 in 35 lines, all on the charge and authorize requests
  and the RtnData schema. (1) v2.13.1+f6b9766 (SC-785, Backbone PR #419): `description` on
  PaymentRequest and AuthorizeRequest is bounded at 256 characters (was 500), and its
  description states that a longer value is truncated to its first 256 characters and never
  blocks the payment; the platform's breaking check allowlisted the tightened bound. The Python
  and PHP cores enforce maxLength in the client, so after this pin they refuse a description of
  257 to 500 characters before sending it; the .NET, Java, TypeScript and Go cores send it and
  the platform truncates. (2) v2.14.0+66c63c6 (SC-837, Backbone PR #427): the request enum
  `merchantTrustLevel` gains MODERATELY_TRUSTED; `merchantTrustData` is redefined as the
  six-character trusted signal code (example T3D2L3); the RtnData and additionalTransactionData
  descriptions add the RTN reporting keys and timing instants Revaly derives. (3)
  v2.14.1+d3c5b38 (SC-846, Backbone PR #433): prose only, the `merchantName` default and
  `acquirerMerchantId` stated optional. (4) v2.15.0+693a36b (SC-867, Backbone PR #442): the
  optional `rtnData.additionalTransactionData.fraudPreventionPlatform` (string, 1 to 128 of
  letters, digits, '.', '_', ':' and '-'); Revaly submits rtnData to RTN only when it is present.
  No response shape, error code, transactionType, reconcile verdict or status change, so the
  failover classification surface is untouched (failover-contract §2). All four platform gates
  pass on v2.15.0; provenance ciRunId 41673813088. Prior pin history: v2.1.2+9af661b (first
  pin, int64 maximum fix) -> v2.1.3+e75c71a (orphan PaymentMethodRequest dropped) ->
  v2.2.0+1e59620 (additive statementDescriptor, STR-108) -> v2.2.1+c4000e9 (X-Correlation-ID
  response header documented) -> v2.3.0+80cc897 (validation reality matches the published
  contract) -> v2.4.0+4ce73e2 (nested vaultToken on charge/authorize, lookup unions oneOf ->
  anyOf, 404 on charge/authorize) -> v2.6.0+abf71b6 (flat vaultToken on TransactionListItem,
  nested vaultToken on the transaction reads, recordRefund documented for gateway-routed
  transactions) -> v2.7.0+7a05e7b (bypassPlatform deprecated, true refused with 404) ->
  v2.12.2+cec0b33 (seven artifacts absorbed, v2.8.0 to v2.12.2: recordRefund 422 prose,
