notes: >-
  Seventh pin (was spec/v2.4.0+4ce73e2; the intermediate spec/v2.5.0+6d41224 of 2026-08-27 was
  never consumed and is superseded by this pin). Additive delta, one schema change and three
  documentation clarifications (53 diff lines): (1) new optional nullable vaultToken string on
  TransactionListItem, reported FLAT on the row alongside the other paymentMethod* fields rather
  than nested — present only on rows that ran against a vault credential and only on the detailed
  response type, omitted (not null, not empty) on every other row. (2) The nested PaymentMethod
  vaultToken widens its reporting surface: it now also appears on the single-transaction reads
  (GET /transactions/{transactionId}, GET /transactions/merchant/{merchantTransactionId}) and on
  every transaction of a group read (includeAllTransactions=true); reads are a snapshot recorded
  at processing time and are never re-resolved, follow-up responses (capture, void, refund,
  refund-cancel) carry no payment method and so report no token, and recording began with API
  2.6.0 — earlier transactions report no token and cannot be backfilled. (3) recordRefund is
  documented for gateway-routed transactions: merchantTransactionId becomes required (at most
  50 characters, not previously used) and is the recorded refund's own merchant transaction id;
  an unknown transactionId returns 404 and an already-recorded refund returns 422. Those two
  statuses are documented in the endpoint example prose only — the events operation's declared
  `responses` set is unchanged, so no generated response type moves. No new error codes,
  transaction types, or reconcile verdicts; no enum introduced or narrowed; the failover
  classification surface is untouched. All four platform gates pass; provenance ciRunId
